structures:
  - sid: 1
    name: EPS
    interval_s: 1.0
    parameters:
      - { param_id: 0x0100, pack_format: H, scale: 100 }
      - { param_id: 0x0101, pack_format: H, scale: 100 }
      - { param_id: 0x0102, pack_format: h, scale: 100 }
      - { param_id: 0x0109, pack_format: h, scale: 100 }
      - { param_id: 0x0103, pack_format: H, scale: 100 }
      - { param_id: 0x0104, pack_format: H, scale: 100 }
      - { param_id: 0x010B, pack_format: H, scale: 100 }
      - { param_id: 0x010C, pack_format: H, scale: 100 }
      - { param_id: 0x0105, pack_format: H, scale: 100 }
      - { param_id: 0x0106, pack_format: H, scale: 10 }
      - { param_id: 0x0107, pack_format: H, scale: 10 }
      - { param_id: 0x0108, pack_format: B, scale: 1 }
      - { param_id: 0x010D, pack_format: B, scale: 1 }
      - { param_id: 0x010E, pack_format: B, scale: 1 }
      - { param_id: 0x010F, pack_format: B, scale: 1 }
      # Power line status
      - { param_id: 0x0110, pack_format: B, scale: 1 }
      - { param_id: 0x0111, pack_format: B, scale: 1 }
      - { param_id: 0x0112, pack_format: B, scale: 1 }
      - { param_id: 0x0113, pack_format: B, scale: 1 }
      - { param_id: 0x0114, pack_format: B, scale: 1 }
      - { param_id: 0x0115, pack_format: B, scale: 1 }
      - { param_id: 0x0116, pack_format: B, scale: 1 }
      - { param_id: 0x0117, pack_format: B, scale: 1 }
      # Per-line currents
      - { param_id: 0x0118, pack_format: H, scale: 1000 }
      - { param_id: 0x0119, pack_format: H, scale: 1000 }
      - { param_id: 0x011A, pack_format: H, scale: 1000 }
      - { param_id: 0x011B, pack_format: H, scale: 1000 }
      - { param_id: 0x011C, pack_format: H, scale: 1000 }
      - { param_id: 0x011D, pack_format: H, scale: 1000 }
      - { param_id: 0x011E, pack_format: H, scale: 1000 }
      - { param_id: 0x011F, pack_format: H, scale: 1000 }
      # Phase 4: Battery DoD, cycles, MPPT, SA aging
      - { param_id: 0x0120, pack_format: H, scale: 100 }
      - { param_id: 0x0121, pack_format: H, scale: 1 }
      # Per-panel solar array currents (Defect #2 fix: per-panel telemetry for single-panel failure diagnostics)
      - { param_id: 0x012B, pack_format: H, scale: 1000 }  # px panel current
      - { param_id: 0x012C, pack_format: H, scale: 1000 }  # mx panel current
      - { param_id: 0x012D, pack_format: H, scale: 1000 }  # py panel current
      - { param_id: 0x012E, pack_format: H, scale: 1000 }  # my panel current
      - { param_id: 0x012F, pack_format: H, scale: 1000 }  # pz panel current
      - { param_id: 0x0130, pack_format: H, scale: 1000 }  # mz panel current
      # Enhanced telemetry: load switching and power management
      - { param_id: 0x0131, pack_format: B, scale: 1 }
      - { param_id: 0x0132, pack_format: H, scale: 1000 }
      - { param_id: 0x0143, pack_format: H, scale: 1000 }  # actual_charge_current_a (Defect #4)
      - { param_id: 0x0133, pack_format: h, scale: 100 }
      - { param_id: 0x0134, pack_format: B, scale: 1 }
      - { param_id: 0x0135, pack_format: h, scale: 10 }
      - { param_id: 0x0136, pack_format: H, scale: 100 }
      - { param_id: 0x0137, pack_format: B, scale: 1 }
      - { param_id: 0x0138, pack_format: B, scale: 1 }
      - { param_id: 0x0139, pack_format: h, scale: 100 }
      # 2026-08b: wing_status promoted into SID 1 (1 byte at 1 Hz = 8 bps of
      # the 16 kbps LOW tier). It lived only in SID 8, which is NOT in
      # simulation.yaml default_enabled_sids [1, 11], so an operator could run
      # a whole session at 18.6 W generation with the wings stowed and nothing
      # on any display said so — the single biggest contributor to the
      # reported "generation drops off way too fast" symptom. It stays in
      # SID 8 as well; duplication across structures is normal and costs a byte.
      - { param_id: 0x0144, pack_format: B, scale: 1 }     # wing_status
      # 2026-08c item 3: the ninth power line (propulsion). The 0x0110/0x0118
      # blocks were sized for 8 lines; prop's ids are explicit (0x014A/0x014B)
      # and were on_demand-only, so the console's PL8 PROP row read "—"
      # forever. 3 bytes at 1 Hz = 24 bps of the 16 kbps LOW tier.
      - { param_id: 0x014A, pack_format: B, scale: 1 }     # pl_prop status
      - { param_id: 0x014B, pack_format: H, scale: 1000 }  # line_current_8 (A)

  # Phase B (brief 01 WP-11): EPS power-management SID — wing/SADA status,
  # per-wing currents, total load current, eclipse flag, power margin and the
  # per-subsystem power split. A dedicated 8 s structure rather than fields
  # in the 1 Hz SID 1: at 1 Hz these 27 bytes would have cost ~215 bps of the
  # 16 kbps LOW-tier channel; at 8 s they cost ~27 bps. Enabled during
  # commissioning with the other subsystem SIDs (TC(3,5) HK_ENABLE sid=8).
  - sid: 8
    name: EPS Power Management
    interval_s: 8.0
    parameters:
      - { param_id: 0x0144, pack_format: B, scale: 1 }     # wing_status
      - { param_id: 0x0133, pack_format: h, scale: 100 }   # SADA angle
      - { param_id: 0x0146, pack_format: H, scale: 1000 }  # +Y wing current
      - { param_id: 0x0147, pack_format: H, scale: 1000 }  # -Y wing current
      - { param_id: 0x0148, pack_format: H, scale: 1000 }  # total load current
      - { param_id: 0x013A, pack_format: B, scale: 1 }     # eclipse_active
      # The illumination AUTHORITY (0.0 umbra … 1.0 full sun). Rides the
      # same packet as the power terms so an operator can never see
      # generation and an eclipse flag from two different instants.
      - { param_id: 0x0142, pack_format: H, scale: 10000 } # sun_fraction
      - { param_id: 0x013B, pack_format: h, scale: 10 }    # power_margin
      - { param_id: 0x013C, pack_format: H, scale: 10 }    # subsys_power_eps
      - { param_id: 0x013D, pack_format: H, scale: 10 }    # subsys_power_aocs
      - { param_id: 0x013E, pack_format: H, scale: 10 }    # subsys_power_tcs
      - { param_id: 0x013F, pack_format: H, scale: 10 }    # subsys_power_ttc
      - { param_id: 0x0140, pack_format: H, scale: 10 }    # subsys_power_payload
      - { param_id: 0x0141, pack_format: H, scale: 10 }    # subsys_power_obdh

  - sid: 2
    name: AOCS
    interval_s: 4.0
    parameters:
      - { param_id: 0x0200, pack_format: h, scale: 10000 }
      - { param_id: 0x0201, pack_format: h, scale: 10000 }
      - { param_id: 0x0202, pack_format: h, scale: 10000 }
      - { param_id: 0x0203, pack_format: h, scale: 10000 }
      - { param_id: 0x0204, pack_format: h, scale: 10000 }
      - { param_id: 0x0205, pack_format: h, scale: 10000 }
      - { param_id: 0x0206, pack_format: h, scale: 10000 }
      - { param_id: 0x0217, pack_format: H, scale: 1000 }
      - { param_id: 0x0207, pack_format: h, scale: 1 }
      - { param_id: 0x0208, pack_format: h, scale: 1 }
      - { param_id: 0x0209, pack_format: h, scale: 1 }
      - { param_id: 0x020A, pack_format: h, scale: 1 }
      - { param_id: 0x020F, pack_format: B, scale: 1 }
      # Star tracker status
      - { param_id: 0x0240, pack_format: B, scale: 1 }
      - { param_id: 0x0241, pack_format: B, scale: 1 }
      - { param_id: 0x0242, pack_format: B, scale: 1 }
      - { param_id: 0x0243, pack_format: B, scale: 1 }
      - { param_id: 0x0244, pack_format: B, scale: 1 }
      # CSS sun vector
      - { param_id: 0x0245, pack_format: h, scale: 10000 }
      - { param_id: 0x0246, pack_format: h, scale: 10000 }
      - { param_id: 0x0247, pack_format: h, scale: 10000 }
      - { param_id: 0x0248, pack_format: B, scale: 1 }
      # RW currents
      - { param_id: 0x0250, pack_format: H, scale: 1000 }
      - { param_id: 0x0251, pack_format: H, scale: 1000 }
      - { param_id: 0x0252, pack_format: H, scale: 1000 }
      - { param_id: 0x0253, pack_format: H, scale: 1000 }
      # RW temperatures (defect #24 — needed to observe bearing-seizure heating)
      - { param_id: 0x0218, pack_format: h, scale: 100 }
      - { param_id: 0x0219, pack_format: h, scale: 100 }
      - { param_id: 0x021A, pack_format: h, scale: 100 }
      - { param_id: 0x021B, pack_format: h, scale: 100 }
      # RW enabled flags
      - { param_id: 0x0254, pack_format: B, scale: 1 }
      - { param_id: 0x0255, pack_format: B, scale: 1 }
      - { param_id: 0x0256, pack_format: B, scale: 1 }
      - { param_id: 0x0257, pack_format: B, scale: 1 }
      # Magnetorquer duty
      - { param_id: 0x0258, pack_format: h, scale: 100 }
      - { param_id: 0x0259, pack_format: h, scale: 100 }
      - { param_id: 0x025A, pack_format: h, scale: 100 }
      - { param_id: 0x025B, pack_format: H, scale: 1000 }
      # Equipment enabled flags
      - { param_id: 0x025C, pack_format: B, scale: 1 }   # mag_enabled
      - { param_id: 0x025D, pack_format: B, scale: 1 }   # gyro_enabled
      - { param_id: 0x025E, pack_format: B, scale: 1 }   # mtq_enabled
      # Mode metadata
      - { param_id: 0x0262, pack_format: B, scale: 1 }
      - { param_id: 0x0264, pack_format: I, scale: 1 }
      # Individual CSS head illumination values (defects/reviews/aocs.md Defect #4)
      - { param_id: 0x027A, pack_format: H, scale: 1000 }  # css_px (+X head)
      - { param_id: 0x027B, pack_format: H, scale: 1000 }  # css_mx (-X head)
      - { param_id: 0x027C, pack_format: H, scale: 1000 }  # css_py (+Y head)
      - { param_id: 0x027D, pack_format: H, scale: 1000 }  # css_my (-Y head)
      - { param_id: 0x027E, pack_format: H, scale: 1000 }  # css_pz (+Z head)
      - { param_id: 0x027F, pack_format: H, scale: 1000 }  # css_mz (-Z head)
      # Phase 4: Gyro bias, GPS, mag field
      - { param_id: 0x0270, pack_format: h, scale: 100000 }
      - { param_id: 0x0271, pack_format: h, scale: 100000 }
      - { param_id: 0x0272, pack_format: h, scale: 100000 }
      - { param_id: 0x0273, pack_format: h, scale: 100 }
      - { param_id: 0x0274, pack_format: B, scale: 1 }
      - { param_id: 0x0275, pack_format: H, scale: 100 }
      - { param_id: 0x0276, pack_format: B, scale: 1 }
      - { param_id: 0x0277, pack_format: I, scale: 1 }
      # Wave 5-C: Slew and momentum management
      - { param_id: 0x0280, pack_format: H, scale: 100 }
      - { param_id: 0x0281, pack_format: H, scale: 100 }
      - { param_id: 0x0282, pack_format: H, scale: 100 }
      - { param_id: 0x0283, pack_format: B, scale: 1 }
      # 2026-08b AOCS batch. Mode management is the highest-value addition
      # here: without commanded_mode / mode_demoted an operator cannot tell a
      # transient apart from a spacecraft that has quietly abandoned its
      # mission mode (which is exactly what six orbits of the instrumented run
      # looked like on the ground).
      - { param_id: 0x0297, pack_format: B, scale: 1 }   # commanded_mode
      - { param_id: 0x0298, pack_format: B, scale: 1 }   # mode_demoted
      - { param_id: 0x0299, pack_format: B, scale: 1 }   # fine_degraded
      - { param_id: 0x029A, pack_format: B, scale: 1 }   # desat_inhibit
      - { param_id: 0x029B, pack_format: H, scale: 100000 }  # |h_body| N.m.s
      - { param_id: 0x029C, pack_format: B, scale: 1 }   # desat_ineffective
      - { param_id: 0x029D, pack_format: B, scale: 1 }   # wheels_commissioned
      # Gyro wiring — these make the three S2 gyro device commands observable.
      - { param_id: 0x0294, pack_format: B, scale: 1 }   # gyro_units_on
      - { param_id: 0x0295, pack_format: B, scale: 1 }   # gyro_saturated
      # WHICH unit is off, not just how many — the count cannot tell "the X
      # channel is down" from "the Z channel is down", and those have very
      # different consequences for a nadir-pointing spacecraft.
      - { param_id: 0x02D1, pack_format: B, scale: 1 }   # gyro_units_mask
      # Bias still present at the gyro output AFTER on-board compensation: the
      # scalar an operator trends to confirm a calibration actually took.
      - { param_id: 0x02D2, pack_format: H, scale: 100000 }  # gyro_bias_resid
      # 2026-08c item 1: MEASURED body-frame magnetic field. The B-dot law is
      # magnetometer-driven, but the measured B was on_demand-only, so MTQ
      # behaviour could not be checked from the console. int32 nT covers the
      # full LEO field (±60 000 nT) with margin; validity is 0x025C above.
      # 12 bytes at 4 s = 24 bps.
      - { param_id: 0x020B, pack_format: i, scale: 1 }   # mag_x (nT, measured)
      - { param_id: 0x020C, pack_format: i, scale: 1 }   # mag_y
      - { param_id: 0x020D, pack_format: i, scale: 1 }   # mag_z

  - sid: 3
    name: TCS
    interval_s: 60.0
    parameters:
      - { param_id: 0x0400, pack_format: h, scale: 100 }
      - { param_id: 0x0401, pack_format: h, scale: 100 }
      - { param_id: 0x0402, pack_format: h, scale: 100 }
      - { param_id: 0x0403, pack_format: h, scale: 100 }
      - { param_id: 0x0404, pack_format: h, scale: 100 }
      - { param_id: 0x0405, pack_format: h, scale: 100 }
      - { param_id: 0x0406, pack_format: h, scale: 100 }
      - { param_id: 0x0407, pack_format: h, scale: 100 }
      - { param_id: 0x0408, pack_format: h, scale: 100 }
      - { param_id: 0x040A, pack_format: B, scale: 1 }
      - { param_id: 0x040B, pack_format: B, scale: 1 }
      - { param_id: 0x040C, pack_format: B, scale: 1 }
      # Phase 4: Heater duty cycles and total power
      - { param_id: 0x040E, pack_format: H, scale: 100 }
      - { param_id: 0x040F, pack_format: H, scale: 100 }
      - { param_id: 0x0411, pack_format: H, scale: 10 }
      # Phase 5: Event generation and advanced thermal control
      - { param_id: 0x0418, pack_format: B, scale: 1 }
      - { param_id: 0x0419, pack_format: h, scale: 100 }

  - sid: 4
    name: Platform
    interval_s: 8.0
    parameters:
      - { param_id: 0x0300, pack_format: B, scale: 1 }
      - { param_id: 0x0302, pack_format: H, scale: 100 }
      - { param_id: 0x0303, pack_format: H, scale: 100 }
      - { param_id: 0x0304, pack_format: I, scale: 1 }
      - { param_id: 0x0305, pack_format: I, scale: 1 }
      - { param_id: 0x0306, pack_format: H, scale: 1 }
      # Last TC failure code — sits next to the rejection counter it explains
      # (defect #88). Two octets, appended to the SID 4 layout.
      - { param_id: 0x0315, pack_format: H, scale: 1 }
      - { param_id: 0x0307, pack_format: I, scale: 1 }
      - { param_id: 0x0308, pack_format: I, scale: 1 }
      - { param_id: 0x0309, pack_format: I, scale: 1 }   # OBC CUC time
      - { param_id: 0x030A, pack_format: H, scale: 1 }
      # Dual OBC params
      - { param_id: 0x030C, pack_format: B, scale: 1 }
      - { param_id: 0x030D, pack_format: B, scale: 1 }
      - { param_id: 0x030E, pack_format: B, scale: 1 }
      - { param_id: 0x030F, pack_format: B, scale: 1 }
      - { param_id: 0x0310, pack_format: B, scale: 1 }
      - { param_id: 0x0311, pack_format: B, scale: 1 }
      # Spacecraft phase (canonical id, written by engine._tick_spacecraft_phase)
      - { param_id: 0x0129, pack_format: B, scale: 1 }
      # Buffer fills
      - { param_id: 0x0312, pack_format: H, scale: 100 }
      - { param_id: 0x0313, pack_format: H, scale: 100 }
      - { param_id: 0x0314, pack_format: H, scale: 100 }
      # Phase 4: SEU, scrub, tasks, stack/heap
      - { param_id: 0x0319, pack_format: H, scale: 1 }
      - { param_id: 0x031A, pack_format: H, scale: 100 }
      - { param_id: 0x031B, pack_format: B, scale: 1 }
      - { param_id: 0x031C, pack_format: H, scale: 100 }
      - { param_id: 0x031D, pack_format: H, scale: 100 }
      - { param_id: 0x031E, pack_format: H, scale: 1 }
      # Onboard clock (TIME_ARCHITECTURE.md Part B). 0x0309 above carries the
      # coarse CUC second; these carry the sub-second, the time reference and
      # the age of the last sync, so an operator can see the state of the
      # clock in routine HK without an S9,2 request.
      - { param_id: 0x0A12, pack_format: H, scale: 1 }   # obc_time_fine (1/65536 s)
      - { param_id: 0x0A13, pack_format: B, scale: 1 }   # time_ref
      - { param_id: 0x0A14, pack_format: I, scale: 1 }   # time_since_sync_s
      # Application boot progress (verification-semantics ruling). OBC_BOOT_APP's
      # S1.7 now arrives when the 10 s CRC window CLOSES, not when the command
      # is accepted, so the operator has to be able to SEE that window: 0x0A15
      # says which of bootloader / verifying / application / failed the OBC is
      # in, 0x0A16 counts the window down.
      - { param_id: 0x0A15, pack_format: B, scale: 1 }   # boot_state
      - { param_id: 0x0A16, pack_format: H, scale: 10 }  # boot_time_remaining_s
      # FDIR summary (design_2026-08 disposition M5-M7): the modern console
      # derives its spacecraft-mode / FDIR story from TELEMETRY instead of
      # the simulator's state endpoint, so these four (written every tick by
      # the engine's FDIR telemetry pass, previously on-demand only) now
      # ride routine platform HK. 4 bytes every 8 s = +4.6 bps of channel
      # after RS/framing expansion — the price of an honest TM-derived FDIR
      # story that also works in real mode. SID 4 chosen because it is the
      # platform SID that already carries the other spacecraft-level state
      # (phase 0x0129, clock trio) at the right 8 s cadence; SID 1/2
      # (1-4 s) would multiply the cost for no operational gain.
      - { param_id: 0x0700, pack_format: B, scale: 1 }   # fdir.level (0-3)
      - { param_id: 0x0701, pack_format: B, scale: 1 }   # fdir.active_alarms
      - { param_id: 0x0702, pack_format: B, scale: 1 }   # fdir.critical_alarms
      - { param_id: 0x0703, pack_format: B, scale: 1 }   # fdir.high_alarms

  - sid: 5
    name: Payload
    interval_s: 8.0
    parameters:
      - { param_id: 0x0600, pack_format: B, scale: 1 }
      - { param_id: 0x0601, pack_format: h, scale: 100 }
      - { param_id: 0x0602, pack_format: H, scale: 10 }
      - { param_id: 0x0603, pack_format: h, scale: 100 }
      - { param_id: 0x0604, pack_format: H, scale: 100 }
      - { param_id: 0x0605, pack_format: H, scale: 1 }
      - { param_id: 0x0609, pack_format: H, scale: 1 }
      # Memory and scene metadata
      - { param_id: 0x060A, pack_format: I, scale: 1 }
      - { param_id: 0x060B, pack_format: I, scale: 1 }
      - { param_id: 0x060C, pack_format: H, scale: 1 }
      - { param_id: 0x0610, pack_format: B, scale: 1 }
      - { param_id: 0x0612, pack_format: B, scale: 1 }
      # Phase 4: Compression, cal lamp, SNR, detector temp
      - { param_id: 0x0614, pack_format: H, scale: 100 }
      - { param_id: 0x0615, pack_format: B, scale: 1 }
      - { param_id: 0x0617, pack_format: h, scale: 100 }
      # Calibration and transfer state
      - { param_id: 0x062A, pack_format: B, scale: 1 }
      - { param_id: 0x062B, pack_format: H, scale: 100 }
      - { param_id: 0x062C, pack_format: I, scale: 1 }
      - { param_id: 0x062D, pack_format: B, scale: 1 }
      - { param_id: 0x062E, pack_format: H, scale: 100 }
      - { param_id: 0x062F, pack_format: H, scale: 100 }
      # 2026-08b (PL-a / PL-c / PL-d). Eleven octets that answer the three
      # questions an operator could not answer from SID 5 before: what is the
      # calibration doing, what is in the image store, and how much cooling
      # authority is left. `cooler_margin_k` in particular is the honest
      # explanation for an FPA that will not come ready — the failure Franz
      # reported as "cannot do a capture, FPA does not get to YES".
      - { param_id: 0x0644, pack_format: B, scale: 1 }     # cal_mode
      - { param_id: 0x0645, pack_format: B, scale: 1 }     # cal_abort_reason
      - { param_id: 0x0646, pack_format: B, scale: 1 }     # cal_valid_mask
      - { param_id: 0x0647, pack_format: I, scale: 100 }   # product_mb
      - { param_id: 0x0648, pack_format: H, scale: 1 }     # product_count
      - { param_id: 0x0649, pack_format: B, scale: 1 }     # readout_active
      - { param_id: 0x064A, pack_format: h, scale: 100 }   # cooler_floor_c
      - { param_id: 0x064B, pack_format: h, scale: 100 }   # cooler_margin_k

  - sid: 6
    name: TTC
    interval_s: 8.0
    parameters:
      - { param_id: 0x0500, pack_format: B, scale: 1 }
      - { param_id: 0x0501, pack_format: B, scale: 1 }
      - { param_id: 0x0506, pack_format: I, scale: 1 }
      - { param_id: 0x0507, pack_format: h, scale: 100 }
      - { param_id: 0x0508, pack_format: B, scale: 1 }
      # BER, PA, lock sequence
      - { param_id: 0x050D, pack_format: h, scale: 10 }
      - { param_id: 0x050F, pack_format: h, scale: 100 }
      - { param_id: 0x0510, pack_format: B, scale: 1 }
      - { param_id: 0x0511, pack_format: B, scale: 1 }
      - { param_id: 0x0512, pack_format: B, scale: 1 }
      - { param_id: 0x0513, pack_format: I, scale: 1 }
      - { param_id: 0x0516, pack_format: B, scale: 1 }
      # 0x0525 ttc.tx_active — is the S-band prime chain actually radiating?
      # Periodic rather than on-demand, and worth its single byte: it is the
      # parameter that answers "why is there no telemetry", and every other
      # packet in this structure is gated on it (2026-08b, finding T-a). The
      # per-condition breakdown (0x052B) and the UHF beacon transmitter set
      # (0x0526-0x052A) stay on-demand — one byte here, the diagnosis on
      # request. +1.15 bps of channel.
      - { param_id: 0x0525, pack_format: B, scale: 1 }
      # Phase 4: AGC, Doppler, range rate, cmd auth
      - { param_id: 0x051B, pack_format: i, scale: 1 }
      - { param_id: 0x051D, pack_format: B, scale: 1 }
      # Hidden telemetry now exposed
      - { param_id: 0x051E, pack_format: I, scale: 1 }
      - { param_id: 0x051F, pack_format: I, scale: 1 }
      - { param_id: 0x0520, pack_format: B, scale: 1 }
      - { param_id: 0x0521, pack_format: B, scale: 1 }
      - { param_id: 0x0522, pack_format: H, scale: 10 }
      # Rate ladder (brief 08 finding 13). 0x0539-0x053C carry limit bands in
      # mcs/limits.yaml but were in no HK structure — S20 poll only — so after
      # defects #85/#86 made the tier ladder the core link lesson, the console
      # could not show ACTIVE vs COMMANDED tier from routine housekeeping.
      - { param_id: 0x0539, pack_format: B, scale: 1 }
      - { param_id: 0x053A, pack_format: B, scale: 1 }
      - { param_id: 0x053B, pack_format: I, scale: 1 }
      - { param_id: 0x053C, pack_format: B, scale: 1 }

  # Phase C (brief 02 WP-8): AOCS determination & control telemetry.
  # Default DISABLED (enabled by TC(3,5) like SIDs 2-6) — SID 2 is NOT
  # extended: it is referenced verbatim by procedures, tests and the
  # textbook, and the beacon-tier bit budget would not survive SID growth.
  - sid: 7
    name: AOCS_DETERMINATION
    interval_s: 4.0
    parameters:
      - { param_id: 0x02A0, pack_format: h, scale: 10000 }  # q_est x
      - { param_id: 0x02A1, pack_format: h, scale: 10000 }  # q_est y
      - { param_id: 0x02A2, pack_format: h, scale: 10000 }  # q_est z
      - { param_id: 0x02A3, pack_format: h, scale: 10000 }  # q_est w
      - { param_id: 0x02A4, pack_format: h, scale: 1000 }   # rate_est_x
      - { param_id: 0x02A5, pack_format: h, scale: 1000 }   # rate_est_y
      - { param_id: 0x02A6, pack_format: h, scale: 1000 }   # rate_est_z
      - { param_id: 0x02A7, pack_format: H, scale: 10 }     # knowledge arcsec
      - { param_id: 0x02A8, pack_format: H, scale: 1000 }   # control err deg
      - { param_id: 0x02A9, pack_format: I, scale: 10 }     # control arcsec
      - { param_id: 0x02AA, pack_format: H, scale: 1000 }   # total 3sig deg
      - { param_id: 0x02AB, pack_format: h, scale: 10000 }  # q_ref x
      - { param_id: 0x02AC, pack_format: h, scale: 10000 }  # q_ref y
      - { param_id: 0x02AD, pack_format: h, scale: 10000 }  # q_ref z
      - { param_id: 0x02AE, pack_format: h, scale: 10000 }  # q_ref w
      - { param_id: 0x02AF, pack_format: B, scale: 1 }      # pointing frame
      - { param_id: 0x02B0, pack_format: h, scale: 10000 }  # nadir_body x
      - { param_id: 0x02B1, pack_format: h, scale: 10000 }  # nadir_body y
      - { param_id: 0x02B2, pack_format: h, scale: 10000 }  # nadir_body z
      - { param_id: 0x02B6, pack_format: h, scale: 10000 }  # h_body_x (0.1 mNms res)
      - { param_id: 0x02B7, pack_format: h, scale: 10000 }  # h_body_y
      - { param_id: 0x02B8, pack_format: h, scale: 10000 }  # h_body_z
      - { param_id: 0x02B9, pack_format: H, scale: 10000 }  # |h_body|
      - { param_id: 0x02BA, pack_format: H, scale: 10 }     # h_env_frac %
      - { param_id: 0x02BB, pack_format: h, scale: 1000 }   # mtq dipole x
      - { param_id: 0x02BC, pack_format: h, scale: 1000 }   # mtq dipole y
      - { param_id: 0x02BD, pack_format: h, scale: 1000 }   # mtq dipole z
      - { param_id: 0x02C1, pack_format: B, scale: 1 }      # est_source
      - { param_id: 0x02C2, pack_format: H, scale: 1 }      # innov rejects
      - { param_id: 0x02C3, pack_format: H, scale: 10000 }  # rate stab 3sig
      - { param_id: 0x02C4, pack_format: H, scale: 10 }     # settle time s
      - { param_id: 0x02C5, pack_format: B, scale: 1 }      # fine_ready mask
      - { param_id: 0x02C7, pack_format: I, scale: 10 }     # geoloc err m
      - { param_id: 0x02C8, pack_format: H, scale: 10 }     # aocs power W
      # Gyro bias calibration (S8.1 func 13). It belongs on the determination
      # SID: it is an ESTIMATOR activity, it runs for minutes, and an operator
      # watching a calibration needs progress at the 4 s cadence of this SID
      # rather than the 8 s of SID 2.
      - { param_id: 0x02C9, pack_format: B, scale: 1 }      # cal state
      - { param_id: 0x02CA, pack_format: B, scale: 1 }      # cal progress %
      - { param_id: 0x02CB, pack_format: h, scale: 100000 } # cal bias x deg/s
      - { param_id: 0x02CC, pack_format: h, scale: 100000 } # cal bias y
      - { param_id: 0x02CD, pack_format: h, scale: 100000 } # cal bias z
      - { param_id: 0x02CE, pack_format: H, scale: 100000 } # applied comp mag
      - { param_id: 0x02CF, pack_format: B, scale: 1 }      # cal result
      - { param_id: 0x02D0, pack_format: H, scale: 1 }      # cal reject code

  # SID 9 — Propulsion (Phase D). NOTE: brief 03 planned "SID 7", but Phase C
  # took SID 7 for AOCS determination; SID 9 is the next free structure.
  # ~26 parameters ≈ 45 bytes at 8 s ≈ 45 bps (+3 % of the 1351.5 bps HK
  # total — safe at the LOW 16 kbps tier). Disabled at power-up like every
  # subsystem SID (simulation.yaml default_enabled_sids: [1, 11]); commanded
  # on with TC(3,5) HK_ENABLE sid=9 during commissioning / manoeuvre prep.
  - sid: 9
    name: PROP
    interval_s: 8.0
    parameters:
      - { param_id: 0x0B00, pack_format: B, scale: 1 }      # state
      - { param_id: 0x0B01, pack_format: H, scale: 100 }    # tank P (bar)
      - { param_id: 0x0B02, pack_format: H, scale: 10 }     # propellant (g)
      - { param_id: 0x0B03, pack_format: H, scale: 100 }    # propellant %
      - { param_id: 0x0B04, pack_format: h, scale: 100 }    # tank temp
      - { param_id: 0x0B05, pack_format: h, scale: 10 }     # catbed temp
      - { param_id: 0x0B06, pack_format: B, scale: 1 }      # latch A
      - { param_id: 0x0B07, pack_format: B, scale: 1 }      # latch B
      - { param_id: 0x0B08, pack_format: B, scale: 1 }      # FCV
      - { param_id: 0x0B09, pack_format: H, scale: 10 }     # thrust (mN)
      - { param_id: 0x0B0A, pack_format: H, scale: 10 }     # Isp (s)
      - { param_id: 0x0B0B, pack_format: H, scale: 100 }    # dv accum (m/s)
      - { param_id: 0x0B0C, pack_format: H, scale: 100 }    # dv remaining
      - { param_id: 0x0B0D, pack_format: B, scale: 1 }      # burn status
      - { param_id: 0x0B0E, pack_format: H, scale: 100 }    # dv cmd
      - { param_id: 0x0B0F, pack_format: H, scale: 100 }    # dv achieved
      - { param_id: 0x0B10, pack_format: H, scale: 10 }     # t_burn cmd (s)
      - { param_id: 0x0B11, pack_format: H, scale: 10 }     # t_burn elapsed
      - { param_id: 0x0B12, pack_format: H, scale: 1 }      # burn count
      - { param_id: 0x0B13, pack_format: H, scale: 10 }     # total on-time
      - { param_id: 0x0B14, pack_format: B, scale: 1 }      # abort reason
      - { param_id: 0x0B15, pack_format: H, scale: 1 }      # arm inhibit mask
      - { param_id: 0x0B18, pack_format: H, scale: 1000 }   # sc mass (kg)

  # SID 10 (BootLoader) removed — the bootloader emits only SID 11 (Beacon).
  # Per the flight-representative design, the bootloader has a single minimal
  # HK packet; platform/OBDH/payload telemetry is produced only by the
  # application software (phase ≥ 4).

  - sid: 11
    name: Beacon
    # 30 s, per the SpaceCDF operations manual (Ch 15, "SID 11 beacon @ 30 s")
    # and every doc that quotes it (OPERATIONS_GUIDE, PUS_SERVICE_REFERENCE,
    # architecture.md, tm_storage.py's store-sizing budget, and
    # tests/test_integration/test_commissioning_rf.py, which already ticks 35
    # times "because SID 11 interval is 30 s").  The file previously said 10 s,
    # which was the sole outlier.  30 s is also the right platform answer: the
    # beacon is the bootloader lifeline, sent at the BEACON tier (1 kbps)
    # on the stowed-antenna link with the PA off, so its cadence is a power and
    # link-budget decision, not a data-freshness one.  At 30 s an operator still
    # gets 10-16 beacons in a typical 5-8 min polar pass — ample to confirm the
    # OBC is alive, read the battery, and see the reboot counter — while a 10 s
    # cadence triples the transmit duty cycle in exactly the mode where power is
    # scarcest.
    interval_s: 30.0
    #
    # 2026-08b (Franz's ruling R2): this structure is now carried by a REAL
    # separate radio. The UHF beacon transmitter (ttc.yaml `beacon:` block,
    # 437.5 MHz, 1 W into a dipole) emits SID 11 — and only SID 11 — whenever
    # the S-band prime chain is not radiating. So this is the packet you get
    # when the PA is off, the ttc_tx line is pulled, the transponder has
    # failed or the patch never deployed, which is exactly when you most need
    # to know the OBC is alive.
    #
    # 7 parameters — the 6 canonical bootloader ones (SPACECDF_RECONCILE item
    # 8) plus ttc.pa_on. The seventh is the diagnostic that makes the beacon
    # earn its place: reading "S-band PA is OFF" from the ONE packet that
    # still arrives when the S-band chain is silent turns "no telemetry" from
    # a mystery into a one-command fix (TTC_PA_ENABLE, S8 func 66). One byte
    # every 30 s = +0.31 bps of channel; the beacon carries it with 100x
    # headroom at 1 kbps.
    parameters:
      - { param_id: 0x0100, pack_format: H, scale: 100 }    # bat_voltage
      - { param_id: 0x0101, pack_format: H, scale: 100 }    # bat_soc
      - { param_id: 0x0300, pack_format: B, scale: 1 }      # obc_mode
      - { param_id: 0x030A, pack_format: H, scale: 1 }      # reboot_count
      - { param_id: 0x0311, pack_format: B, scale: 1 }      # sw_image
      - { param_id: 0x030C, pack_format: B, scale: 1 }      # active_obc
      - { param_id: 0x0516, pack_format: B, scale: 1 }      # ttc.pa_on

  # SID 12 — GPS navigation (2026-08c item 2). The receiver reported only
  # fix/PDOP/sat-count; the PVT solution the orbit-determination procedures
  # (LEOP-003) rely on was never downlinked. All values are MEASURED
  # (receiver noise scaled by PDOP), gated on gps_fix: position zeroed below
  # fix 2, velocity zeroed below fix 3 — honest-invalid, never truth.
  # Disabled at power-up like every subsystem SID (simulation.yaml
  # default_enabled_sids [1, 11]); enable with TC(3,5) HK_ENABLE sid=12
  # during GPS commissioning. ~35 bytes at 8 s ≈ 35 bps.
  - sid: 12
    name: GPS_NAV
    interval_s: 8.0
    parameters:
      - { param_id: 0x0274, pack_format: B, scale: 1 }      # gps_fix
      - { param_id: 0x0276, pack_format: B, scale: 1 }      # num_sats
      - { param_id: 0x0275, pack_format: H, scale: 100 }    # pdop
      - { param_id: 0x0210, pack_format: i, scale: 10000 }  # lat (1e-4 deg)
      - { param_id: 0x0211, pack_format: i, scale: 10000 }  # lon (1e-4 deg)
      - { param_id: 0x0212, pack_format: I, scale: 1000 }   # alt (km, mm res)
      - { param_id: 0x0231, pack_format: i, scale: 1 }      # ECEF X (m)
      - { param_id: 0x0232, pack_format: i, scale: 1 }      # ECEF Y (m)
      - { param_id: 0x0233, pack_format: i, scale: 1 }      # ECEF Z (m)
      - { param_id: 0x0234, pack_format: i, scale: 1000 }   # vel X (mm/s)
      - { param_id: 0x0235, pack_format: i, scale: 1000 }   # vel Y (mm/s)
      - { param_id: 0x0236, pack_format: i, scale: 1000 }   # vel Z (mm/s)
