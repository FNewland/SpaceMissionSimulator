  - { id: 0x053C, name: ttc.downlink_mode, subsystem: ttc, description: "DOWNLINK / payload-dump mode (TTC_SET_DOWNLINK_MODE, S8 func 79). 0=off, 1=on. This is the mode gate on the HIGH tier", on_demand: true }
  - { id: 0x0523, name: ttc.active_gs, subsystem: ttc, description: "Active ground station: 1-based index into orbit.yaml ground_stations, 0 = out of contact", on_demand: true }
  - { id: 0x0524, name: ttc.gs_equipment_status, subsystem: ttc, description: "GS equipment health bitmask, SET bit = healthy: bit0 antenna+tracking, bit1 LNA, bit2 uplink HPA, bit3 reference oscillator+feed. 15 = all healthy", on_demand: true }

  # ── The S-band downlink gate (2026-08b, finding T-a) ──
  # 0x0525 is THE parameter that says whether the prime transmitter is
  # radiating, and it is what SimulationEngine.downlink_active gates every TM
  # packet on. Until it existed, nothing anywhere in the TM chain read the
  # transmitter state at all: the downlink gated on 0x0501 link_status, which
  # is derived from frame_sync — the UPLINK RECEIVE chain — so telemetry
  # flowed with the PA off and 0.0 W of forward power. 0x0525 is carried in
  # periodic HK SID 6, not on_demand: an operator must be able to see it
  # without asking, because it is the answer to "why is there no telemetry".
  # 0x052B carries the WHY behind it in one byte.
  - { id: 0x0525, name: ttc.tx_active, subsystem: ttc, description: "S-band prime downlink radiating (0=inhibited, 1=transmitting). AND of: PA on and not in thermal shutdown, transponder alive, EPS ttc_tx line on, station in view. This is the gate on every TM packet except the UHF beacon's SID 11" }
  - { id: 0x052B, name: ttc.tx_gate_status, subsystem: ttc, description: "Downlink gate breakdown, SET bit = permissive: bit0 PA on, bit1 EPS ttc_tx line on, bit2 station in view, bit3 S-band radiating, bit4 UHF beacon TX commanded on, bit5 UHF beacon radiating, bit6 S-band antenna deployed, bit7 beacon MODE off. 0xDF = transmitting normally", on_demand: true }
  - { id: 0x052C, name: ttc.eirp_dbw, subsystem: ttc, units: dBW, description: "Live S-band EIRP at the COMMANDED PA power = ttc.yaml eirp_dbw + 10*log10(P/pa_ref_power_w). Moves 3.01 dB down at LOW and 3.98 dB up at HIGH — the proof that TTC_SET_TX_POWER (S8 func 68) reaches the link and not just telemetry 0x050D", on_demand: true }

  # ── UHF bootloader beacon TRANSMITTER (Franz's ruling R2, 2026-08b) ──
  # A SECOND RADIO, not a mode of the S-band transponder and not the BEACON
  # rung of the TM rate ladder (that is ttc.beacon_mode, 0x0521 — see
  # docs/LINK_BUDGET_AND_RATES.md §9 for why the two are constantly confused).
  # It carries HK SID 11 and nothing else, and it survives the S-band PA, the
  # ttc_tx line, the transponder and the deployable patch all being dead.
  - { id: 0x0526, name: ttc.beacon_tx_on, subsystem: ttc, description: "UHF beacon transmitter commanded on (TTC_BEACON_TX_ON/OFF, S8 funcs 97/98). 0=off, 1=on", on_demand: true }
  - { id: 0x0527, name: ttc.beacon_active, subsystem: ttc, description: "UHF beacon actually radiating to a station now (commanded on AND in contact AND its link closes). Independent of ttc.tx_active by construction — that independence is the reason the beacon is a second box", on_demand: true }
  - { id: 0x0528, name: ttc.beacon_link_margin, subsystem: ttc, units: dB, description: "UHF beacon link margin against its OWN budget: 437.5 MHz, 1 W into a 0 dBi dipole, 1 kbps, conv+RS, to a -8 dB/K Yagi station. Typically ~27 dB — compare with the S-band LOW rung's ~46 dB and read off where the difference comes from", on_demand: true }
  - { id: 0x0529, name: ttc.beacon_dl_freq, subsystem: ttc, units: MHz, description: "UHF beacon downlink frequency (435-438 MHz amateur-satellite segment; 437.5 MHz as flown)", on_demand: true }
  - { id: 0x052A, name: ttc.beacon_tx_power, subsystem: ttc, units: W, description: "UHF beacon RF output (1.0 W = 30 dBm, EnduroSat UHF Type II typical). 0 W when the beacon transmitter is commanded off", on_demand: true }

