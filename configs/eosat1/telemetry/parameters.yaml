  # The bare bit rate (0x0506) no longer says everything: the ladder has
  # permission gates, so the tier the ground COMMANDED and the tier the
  # spacecraft is ACTUALLY flying can differ, and that difference is the
  # operationally interesting signal. 0x0539 != 0x053A means a gate demoted the
  # link — antenna stowed, DOWNLINK mode not entered, or elevation below the
  # HIGH tier's 10 deg. The console must show both, never just one.
  # Tier indices are positions in subsystems/ttc.yaml tm_rate_tiers:
  #   0 = BEACON (1 kbps)   1 = LOW (16 kbps)   2 = HIGH (128 kbps)
  - { id: 0x0539, name: ttc.tm_tier, subsystem: ttc, description: "ACTIVE TM rate tier index (0=BEACON 1 kbps, 1=LOW 16 kbps, 2=HIGH 128 kbps) — what is on air now, after the permission gates", on_demand: true }
