  # ===== Payload 2026-08b (PL-a / PL-c / PL-d) =====
  # State the ground previously had no way to see: which calibration was asked
  # for and whether it survived, what is actually IN the image store, whether a
  # strip is being read out, and how much cooling authority is left.
  - { id: 0x0644, name: payload.cal_mode, subsystem: payload, description: "Requested calibration phase set (0=DARK, 1=FLAT, 2=BOTH)" }
  - { id: 0x0645, name: payload.cal_abort_reason, subsystem: payload, description: "Why the last calibration stopped (0=none/completed, 1=detector unpowered, 2=shutter moved, 3=lamp state changed, 4=FPA left its band, 5=operator abort)" }
  - { id: 0x0646, name: payload.cal_valid_mask, subsystem: payload, description: "Bands with BOTH a bias and a gain coefficient (bits 0-3 blue/green/red/nir; 0x0F = fully calibrated)" }
  - { id: 0x0647, name: payload.product_mb, subsystem: payload, units: MB, description: "Volume occupied by CATALOGUED image products (distinct from mem_used_mb, which includes the store's pre-existing fill)" }
  - { id: 0x0648, name: payload.product_count, subsystem: payload, description: "Number of image products held in the catalogue" }
  - { id: 0x0649, name: payload.readout_active, subsystem: payload, description: "1 while a commanded strip is being read out (imaging no longer produces data on its own)" }
  # Cooler authority — the payload's mirror of TCS 0x0424 / 0x0425. The
  # achievable floor falls as the sink warms and as the detector dissipates,
  # so a negative margin is the honest, visible reason FPA READY will not come
  # up (see tcs_basic._fpa_achievable_lift_k).
  - { id: 0x064A, name: payload.cooler_floor_c, subsystem: payload, units: C, description: "Coldest FPA temperature the cooler can hold at the present sink and load" }
  - { id: 0x064B, name: payload.cooler_margin_k, subsystem: payload, units: K, description: "Commanded setpoint minus achievable floor; <= 0 means the setpoint is out of reach" }
