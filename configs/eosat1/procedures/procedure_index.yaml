    position_roles:
      flight_director: "Authorize station switchover"
      ttc: "Diagnose GS equipment, switch to backup station"
    command_services: []
    # DECLARED as commanding nothing. The literal `advisory: true` /
    # `advisory_reason:` keys the ruling asked for would need two additive
    # fields on `ProcedureIndexEntry` in
    # `packages/smo-common/src/smo_common/config/schemas.py`, which is a
    # StrictModel and is NOT a Phase-5-owned file — see the phase report. The
    # same declared property is carried by the `runnable:` mapping, which is
    # already in the schema and which `smo_mcs.server._resolve_runnable`
    # already treats as not-runnable for any kind it does not know.
    runnable: {kind: advisory, reason: "Pure ground-segment: every action is
      taken on the ground and the spacecraft is unreachable throughout"}
    # Full rationale (rendered next to the card in the MCS procedure browser):
    # Pure ground-segment. Every action in this card is taken on the GROUND —
    # inspect the antenna controller, check the LNA and receive chain, call the
    # alternate station, replan the pass. The spacecraft is unreachable for the
    # whole of it, which is the point: it is the one contingency where sending a
    # telecommand is impossible by definition. It previously declared
    # `command_services: [8, 17]` while carrying no commanding at all, so
    # "zero commands" looked like a defect. It is now a DECLARED property, and
    # `tools/procedure_audit.py`'s ZERO_COMMAND_PROCEDURE check fails the build
    # for any other card that extracts nothing without saying so.

