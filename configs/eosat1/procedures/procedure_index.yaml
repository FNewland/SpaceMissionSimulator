# ---------------------------------------------------------------------------
# `runnable:` — machine-readable link from an ops procedure to an EXECUTABLE
# definition (roadmap X-12 / defect #83).
#
# The 64 markdown documents in this tree are the operations manual and stay
# authoritative prose; they are NOT rewritten into step lists. An entry that
# carries a `runnable:` link is additionally offered for execution from the
# MCS Procedures tab, which loads the linked definition into the procedure
# runner and shows the markdown alongside it.
#
#   runnable: {kind: activity_type, ref: <name in planning/activity_types.yaml>}
#   runnable: {kind: steps_file,    ref: <path under procedures/, canonical YAML>}
#   runnable: {kind: markdown}      # derive command steps from the **TC:**
#                                   # annotations in this document
#
#   runnable: {kind: advisory, reason: <why>}
#                                   # the document deliberately commands
#                                   # NOTHING; not offered for execution
#
# `runnable: {kind: advisory}` — the document deliberately commands NOTHING.
# Only CTG-020 (ground-segment antenna failure) qualifies today.
# Without the flag, "extracts zero command steps" is indistinguishable from
# the 2026-08b defect in which 21 documents wrote all their commanding behind
# `**Action:**` prose and were silently inert; the audit gate pins
# ZERO_COMMAND_PROCEDURE at zero and an advisory card is the declared
# exception rather than an accident.
#
# `command_services:` is DERIVED, not editorial: it must equal the set of PUS
# service numbers `smo_common.procedures.markdown_steps` actually extracts
# from the document. Before 2026-08b every one of the 67 entries was written by
# hand and 61 of them disagreed with their own document — CTG-001 declared
# [3, 5, 8, 20] while yielding no steps at all. Regenerate with
# `tests/test_content/test_procedure_gates.py::
#  test_command_services_matches_the_extracted_steps`, which fails the build
# on any drift.
#
# Only a few exemplars are linked today (NOM-002, NOM-003, NOM-009, NOM-008).
# Adding a link is a Flight-Ops decision per procedure: a document is only
# automatable if its **TC:** annotations are the whole of its commanding, and
# most contingency procedures deliberately are not.
# ---------------------------------------------------------------------------
