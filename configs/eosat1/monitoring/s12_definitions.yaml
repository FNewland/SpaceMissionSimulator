# S12 On-Board Monitoring Definitions
# Format: param_id, check_type (0=absolute, 1=delta), low_limit, high_limit, severity
#
# This configuration defines 25+ monitoring rules covering all spacecraft subsystems.
# Rules are loaded at engine startup and checked every tick via S12 framework.

s12_definitions:
  # ===== EPS (0x0100-0x013F) =====
  # Battery State of Charge (SoC) monitoring
  - param_id: 0x0101  # eps.bat_soc
    name: "EPS Battery SoC Warning"
    check_type: 0  # absolute
    low_limit: 20.0
    high_limit: 100.0
    severity: WARNING
    description: "Battery state of charge below 20%"

  - param_id: 0x0101  # eps.bat_soc (different rule)
    name: "EPS Battery SoC Critical"
    check_type: 0  # absolute
    low_limit: 10.0
    high_limit: 100.0
    severity: ALARM
    description: "Battery state of charge below 10%"

  # Bus voltage monitoring
  - param_id: 0x0105  # eps.bus_voltage
    name: "EPS Bus Voltage Low"
    check_type: 0  # absolute
    low_limit: 27.0
    high_limit: 35.0
    severity: WARNING
    description: "Bus voltage below 27V (safe threshold)"

  - param_id: 0x0105  # eps.bus_voltage (different rule)
    name: "EPS Bus Voltage Critical"
    check_type: 0  # absolute
    low_limit: 25.0
    high_limit: 35.0
    severity: ALARM
    description: "Bus voltage below 25V (critical)"

  # Battery current monitoring
  - param_id: 0x0109  # eps.bat_current
    name: "EPS Battery Overcurrent"
    check_type: 0  # absolute
    low_limit: -15.0
    high_limit: 15.0
    severity: WARNING
    description: "Battery current magnitude exceeds 15A"

  # Battery temperature monitoring
  - param_id: 0x0102  # eps.bat_temp
    name: "EPS Battery Overtemp"
    check_type: 0  # absolute
    low_limit: -5.0
    high_limit: 45.0
    severity: WARNING
    description: "Battery temperature exceeds 45°C"

  - param_id: 0x0102  # eps.bat_temp (different rule)
    name: "EPS Battery Undertemp"
    check_type: 0  # absolute
    low_limit: -5.0
    high_limit: 50.0
    severity: WARNING
    description: "Battery temperature below -5°C"

  # Solar array current monitoring (during sunlit)
  - param_id: 0x0103  # eps.sa_a_current
    name: "EPS Solar Array A Low Current"
    check_type: 0  # absolute
    low_limit: 0.1
    high_limit: 50.0
    severity: WARNING
    description: "Solar array A current below 0.1A in sunlight"

  - param_id: 0x0104  # eps.sa_b_current
    name: "EPS Solar Array B Low Current"
    check_type: 0  # absolute
    low_limit: 0.1
    high_limit: 50.0
    severity: WARNING
    description: "Solar array B current below 0.1A in sunlight"

  # ===== AOCS (0x0200-0x027F) =====
  # Reaction wheel speed monitoring (per wheel, max ~5000 RPM)
  - param_id: 0x0207  # aocs.rw1_speed
    name: "AOCS Reaction Wheel 1 Overspeed"
    check_type: 0  # absolute
    low_limit: -5000.0
    high_limit: 5000.0
    severity: WARNING
    description: "Reaction wheel 1 speed exceeds ±5000 RPM"

  - param_id: 0x0208  # aocs.rw2_speed
    name: "AOCS Reaction Wheel 2 Overspeed"
    check_type: 0  # absolute
    low_limit: -5000.0
    high_limit: 5000.0
    severity: WARNING
    description: "Reaction wheel 2 speed exceeds ±5000 RPM"

  - param_id: 0x0209  # aocs.rw3_speed
    name: "AOCS Reaction Wheel 3 Overspeed"
    check_type: 0  # absolute
    low_limit: -5000.0
    high_limit: 5000.0
    severity: WARNING
    description: "Reaction wheel 3 speed exceeds ±5000 RPM"

  - param_id: 0x020A  # aocs.rw4_speed
    name: "AOCS Reaction Wheel 4 Overspeed"
    check_type: 0  # absolute
    low_limit: -5000.0
    high_limit: 5000.0
    severity: WARNING
    description: "Reaction wheel 4 speed exceeds ±5000 RPM"

  # Momentum-envelope monitoring (Phase C WP-9). The old monitor sat on
  # 0x025B at ±90 N·m·s — units confused with percent against an 11.5 N·m·s
  # scalar max, so it could never trip and S19 rule 2001 was dead autonomy.
  # 0x02BA is the per-axis-aware envelope fraction in percent.
  - param_id: 0x02BA  # aocs.h_env_frac (%)
    name: "AOCS Momentum Envelope High"
    check_type: 0  # absolute
    low_limit: -1.0
    high_limit: 70.0
    severity: WARNING
    description: "Wheel momentum above 70% of envelope — desaturation required"

  # Attitude error monitoring
  - param_id: 0x0217  # aocs.att_error
    name: "AOCS Attitude Error High"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 1.0
    severity: WARNING
    description: "Attitude error exceeds 1.0 degree"

  # Star tracker status monitoring (status 3=blind, 4=failed)
  - param_id: 0x0240  # aocs.st1_status
    name: "AOCS Star Tracker 1 Blind"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 2.5  # 0=off, 1=boot, 2=tracking; >2 is blind/failed
    severity: ALARM
    description: "Star tracker 1 lost lock (status 3+)"

  - param_id: 0x0243  # aocs.st2_status
    name: "AOCS Star Tracker 2 Blind"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 2.5  # same logic
    severity: ALARM
    description: "Star tracker 2 lost lock (status 3+)"

  # Gyro bias monitoring (threshold ~0.5 deg/s per axis)
  - param_id: 0x0270  # aocs.gyro_bias_x
    name: "AOCS Gyro X-Axis Bias High"
    check_type: 0  # absolute
    low_limit: -0.5
    high_limit: 0.5
    severity: WARNING
    description: "Gyroscope X-axis bias estimate exceeds ±0.5 deg/s"

  - param_id: 0x0271  # aocs.gyro_bias_y
    name: "AOCS Gyro Y-Axis Bias High"
    check_type: 0  # absolute
    low_limit: -0.5
    high_limit: 0.5
    severity: WARNING
    description: "Gyroscope Y-axis bias estimate exceeds ±0.5 deg/s"

  - param_id: 0x0272  # aocs.gyro_bias_z
    name: "AOCS Gyro Z-Axis Bias High"
    check_type: 0  # absolute
    low_limit: -0.5
    high_limit: 0.5
    severity: WARNING
    description: "Gyroscope Z-axis bias estimate exceeds ±0.5 deg/s"

  # ===== TCS (0x0400-0x0417) =====
  # FPA temperature monitoring. DERIVED from subsystems/tcs.yaml
  # `fpa_envelope` (DECISIONS §3, ruled in G3-d) — do not hand-edit; change
  # the envelope and re-derive. Legitimate states of the single FPA node:
  # cooler ON -> anywhere in the COMMANDABLE -20..0 C setpoint envelope
  # (±3 sigma = 0.5 K), cooler OFF -> internal ambient, measured peak
  # +12.4 C. The bands bracket both; imaging readiness is the separate
  # fpa_ready flag, not a limit violation.
  #   warning: setpoint_min - 3sigma - 1.5 K .. uncooled_max + 1.5 K
  #   alarm:   setpoint_min - 3sigma - 5.0 K .. uncooled_max + 5.0 K
  # History: the "Low" rule once had INVERTED limits (low -15 / high -20 —
  # an empty admissible set) and fired at t=0 every session; Phase B fixed
  # that but pinned the band to a -15 C setpoint that Phase E then made
  # commandable, so a legal -20 C command sat exactly on the low limit.
  - param_id: 0x0408  # tcs.temp_fpa
    name: "TCS FPA Temperature Warning"
    check_type: 0  # absolute
    low_limit: -22.0
    high_limit: 14.0
    severity: WARNING
    description: "FPA temperature outside -22..+14°C (overcooled or overheating)"

  - param_id: 0x0408  # tcs.temp_fpa (alarm tier)
    name: "TCS FPA Temperature Alarm"
    check_type: 0  # absolute
    low_limit: -25.5
    high_limit: 17.5
    severity: ALARM
    description: "FPA temperature outside -25.5..+17.5°C (thermal anomaly)"

  # Battery temperature monitoring (internal to TCS)
  - param_id: 0x0407  # tcs.temp_battery
    name: "TCS Battery Overtemp"
    check_type: 0  # absolute
    low_limit: -10.0
    high_limit: 45.0
    severity: WARNING
    description: "Battery temperature exceeds 45°C"

  # OBC temperature monitoring
  - param_id: 0x0406  # tcs.temp_obc
    name: "TCS OBC Overtemp"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 60.0
    severity: ALARM
    description: "OBC temperature exceeds 60°C"

  # Heater power monitoring (all heaters combined). Phase B set 12.5 W for
  # battery 8 + OBC 4 (no thruster heater then); Phase D adds the real 12 W
  # thruster catbed heater, so installed heater power is 24 W -> 24.5 limit.
  - param_id: 0x0411  # tcs.htr_total_power
    name: "TCS Heater Power Limit"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 24.5
    severity: WARNING
    description: "Total heater power above 24.5W (exceeds installed 24W — sensor/model fault)"

  # ===== TTC (0x0500-0x0524) =====
  # RSSI monitoring (typical range -95 to -60 dBm; below -95 is poor)
  - param_id: 0x0502  # ttc.rssi
    name: "TTC RSSI Low"
    check_type: 0  # absolute
    low_limit: -95.0
    high_limit: 0.0
    severity: WARNING
    description: "Received Signal Strength Indicator below -95 dBm"

  # Link margin monitoring (threshold 3 dB is critical)
  - param_id: 0x0503  # ttc.link_margin
    name: "TTC Link Margin Critical"
    check_type: 0  # absolute
    low_limit: 3.0
    high_limit: 100.0
    severity: ALARM
    description: "Link margin below 3 dB (critical)"

  # Energy per bit to noise density (threshold 4 dB)
  - param_id: 0x0519  # ttc.eb_n0
    name: "TTC Eb/N0 Low"
    check_type: 0  # absolute
    low_limit: 4.0
    high_limit: 100.0
    severity: WARNING
    description: "Energy per bit to noise density below 4 dB"

  # Power amplifier temperature monitoring
  - param_id: 0x050F  # ttc.pa_temp
    name: "TTC PA Overtemp"
    check_type: 0  # absolute
    low_limit: -10.0
    high_limit: 60.0
    severity: ALARM
    description: "Power amplifier temperature exceeds 60°C"

  # Bit error rate monitoring (log10 scale: -6 = 1e-6)
  - param_id: 0x050C  # ttc.ber
    name: "TTC Bit Error Rate High"
    check_type: 0  # absolute
    low_limit: -5.0  # 1e-5 is threshold
    high_limit: 0.0
    severity: WARNING
    description: "Bit error rate exceeds 1e-5"

  # ===== OBDH (0x0300-0x031E) =====
  # CPU load monitoring
  - param_id: 0x0302  # obdh.cpu_load
    name: "OBDH CPU Load High"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 90.0
    severity: WARNING
    description: "CPU load exceeds 90%"

  # Memory usage monitoring
  - param_id: 0x0303  # obdh.mmm_used
    name: "OBDH Memory Usage High"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 90.0
    severity: WARNING
    description: "Memory usage exceeds 90%"

  # Reboot count monitoring
  - param_id: 0x030A  # obdh.reboot_count
    name: "OBDH Excessive Reboots"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 3.0
    severity: ALARM
    description: "Reboot count exceeds 3 (anomaly indicator)"

  # Memory error count monitoring
  - param_id: 0x031E  # obdh.mem_errors
    name: "OBDH Memory Errors"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 5.0
    severity: WARNING
    description: "Memory error count exceeds 5"

  # ===== Payload (0x0600-0x0629) =====
  # Detector cold finger (0x0601 = TCS FPA node + detector_offset_c, -0.5 K).
  # DERIVED from subsystems/tcs.yaml `fpa_envelope` (G3-d): the 0x0408 bands
  # shifted by that offset. History: the original low limit (-15.0) sat
  # exactly ON the cooler setpoint and chattered S19 rule 6002 at ~50 % of
  # samples; Phase B moved it to -16.5 for 6 sigma of clearance below a
  # -15.5 C operating point, which was correct until Phase E made the
  # setpoint commandable to -20 C — after which a LEGAL command produced a
  # standing violation. The high limit is an overheat bound, not a "not yet
  # cooled" tripwire (readiness is fpa_ready).
  - param_id: 0x0601  # payload.fpa_temp
    name: "Payload FPA Temperature"
    check_type: 0  # absolute
    low_limit: -22.5
    high_limit: 13.5
    severity: WARNING
    description: "Payload detector outside -22.5..+13.5°C (overcooled or overheating)"

  # Storage utilization monitoring
  - param_id: 0x0604  # payload.store_used
    name: "Payload Storage Full"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 95.0
    severity: WARNING
    description: "Payload storage exceeds 95% full"

  # Checksum error monitoring (should be 0)
  - param_id: 0x0609  # payload.checksum_errors
    name: "Payload Checksum Errors"
    check_type: 0  # absolute
    low_limit: 0.0
    high_limit: 0.5  # triggers if > 0
    severity: WARNING
    description: "Payload checksum errors detected"

  # Signal-to-noise ratio monitoring
  - param_id: 0x0616  # payload.snr
    name: "Payload SNR Low"
    check_type: 0  # absolute
    low_limit: 25.0
    high_limit: 100.0
    severity: WARNING
    description: "Signal-to-noise ratio below 25 dB"

  # ===== PROP (0x0B00-0x0B1B) — Phase D =====
  # Tank pressure operating band (WARNING) and CTG-028 "out-of-band" (ALARM)
  - param_id: 0x0B01  # prop.tank_pressure
    name: "PROP Tank Pressure Band"
    check_type: 0  # absolute
    low_limit: 6.0
    high_limit: 24.0
    severity: WARNING
    description: "Tank pressure outside the 6-24 bar operating band"

  - param_id: 0x0B01  # prop.tank_pressure (alarm band)
    name: "PROP Tank Pressure Out-of-Band"
    check_type: 0  # absolute
    low_limit: 4.0
    high_limit: 26.0
    severity: ALARM
    description: "Tank pressure critically out of band (CTG-028)"

  # Delta check — THE leak/burst-disc detector: a slow leak never crosses the
  # absolute band quickly, but its pressure RATE is visible immediately.
  - param_id: 0x0B01  # prop.tank_pressure (rate)
    name: "PROP Tank Pressure Rate"
    check_type: 1  # delta
    low_limit: -0.20
    high_limit: 0.20
    severity: ALARM
    description: "Tank pressure changing faster than 0.20 bar per check — leak or overpressure transient"

  - param_id: 0x0B05  # prop.catbed_temp
    name: "PROP Catbed Temperature Band"
    check_type: 0  # absolute
    low_limit: -20.0
    high_limit: 300.0
    severity: WARNING
    description: "Catalyst bed outside -20..300 C"

  - param_id: 0x0B05  # prop.catbed_temp (alarm)
    name: "PROP Catbed Overtemp"
    check_type: 0  # absolute
    low_limit: -30.0
    high_limit: 350.0
    severity: ALARM
    description: "Catalyst bed critically out of band (abort threshold)"

  - param_id: 0x0B02  # prop.propellant_mass
    name: "PROP Propellant Low"
    check_type: 0  # absolute
    low_limit: 20.0
    high_limit: 401.0
    severity: WARNING
    description: "Propellant below 20 g — plan remaining dV budget (debris-avoidance reserve)"

  - param_id: 0x0B09  # prop.thrust_est
    name: "PROP Low Thrust"
    check_type: 0  # absolute
    low_limit: 100.0
    high_limit: 400.0
    severity: WARNING
    description: "Thrust estimate below 100 mN while firing — the CTG-028 'low thrust' trigger"

  - param_id: 0x0B0C  # prop.dv_remaining
    name: "PROP dV Envelope Low"
    check_type: 0  # absolute
    low_limit: 5.0
    high_limit: 100.0
    severity: WARNING
    description: "Remaining delta-V below 5 m/s — collision-avoidance reserve at risk"
