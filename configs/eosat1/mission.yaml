# EOSAT-1 Mission Configuration — Ocean Current Monitoring
name: EOSAT-1
description: "6U multispectral imaging cubesat for ocean current monitoring"
spacecraft_apid: 1        # OBC application-software APID
bootloader_apid: 2        # OBC bootloader APID (distinct source for beacon TM)
start_in_bootloader: true # Power up in beacon mode (phase 3, SID 11 only, bootloader APID)
pus_version: 2

# CUC epoch on the wire — LIVE config (no longer dead). Loaded by
# smo_common.config.loader.load_mission_config, which pushes it into
# smo_common.protocol.ecss_packet via set_time_epoch(). The TIME_EPOCH_DEFAULT
# literal in that module is only the fallback for code that loads no mission
# config; a gate test asserts the two agree. J2000.0 = 2000-01-01T12:00:00 UTC.
time_epoch: "2000-01-01T12:00:00"

# Ground/Planner clock source: "sim" follows the simulator's sim_time/speed
# (closed-loop); "real" uses wall-clock UTC (for a real mission link).
# Overridable by SMO_TIME_SOURCE env and --time-source CLI (CLI > env > this).
# Spacecraft OBC time always comes from telemetry regardless of this setting.
time_source: sim
# Where the MCS/Planner poll the simulator's sim_time/speed (sim mode only).
# Defaults to http://<connect_host>:8080/api/state if left unset.
# Overridable by SMO_SIM_STATE_URL env.
# sim_state_url: http://localhost:8080/api/state

orbit:
  type: sun_synchronous
  altitude_km: 450.0
  inclination_deg: 98.0

payload:
  type: multispectral_imager
  bands: [443, 560, 665, 865]  # nm — ocean color
  target: ocean_current_monitoring

# Ground segment — deliberately NOT declared here (brief 08 finding 19 / X-11).
#
# This file used to carry a `ground_segment: {stations: [...], band: S}` block
# that `MissionConfig` does not declare and pydantic silently dropped, with a
# comment asking the reader to keep the station list in step with orbit.yaml
# by hand. A second, unenforced copy of the station list is exactly the drift
# this project's most expensive defects came from, so the copy is gone.
#
# THE canonical station list (names + geometry) is `orbit.yaml: ground_stations`,
# loaded by the simulator's contact model, the planner and the MCS via
# `load_orbit_config`. RF-only augmentation (G/T, frequencies, antenna size)
# lives in `planning/ground_stations.yaml`.

network:
  tc_port: 8001
  tm_port: 8002
  instr_port: 8003
  http_port: 8080
  sim_tick_hz: 1.0
  tm_max_clients: 8
