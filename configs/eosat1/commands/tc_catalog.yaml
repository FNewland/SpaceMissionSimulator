  # SID 9 (PROP, 8 s) and SID 8 (EPS power management, 8 s) are NOT in
  # simulation.yaml's `default_enabled_sids: [1, 11]`, which is correct
  # flight-representative behaviour — the spacecraft does not downlink every
  # structure for free. Both displays therefore open in the NOT ENABLED state
  # and tell the operator to send TC(3,5); these two buttons are the one-shot
  # equivalent, and HK_ENABLE lives in the HK Manager on the PUS tab.
  - { group: "HK REQUESTS (S3.27)", label: "PROP (SID9)",    command: HK_REQUEST, name: HK_REQ_PROP, args: { sid: 9 } }
  - { group: "HK REQUESTS (S3.27)", label: "EPS PWR (SID8)", command: HK_REQUEST, name: HK_REQ_EPS8, args: { sid: 8 } }
