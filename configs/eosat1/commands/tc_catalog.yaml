    description: "Mark memory segment as unusable"
    readback: { param_id: 0x0612, description: "payload.mem_segments_bad" }
    fields:
      - name: segment_id
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: none }
        range: { min: 0, max: 7 }
        default: 0
        description: >-
          Segment index 0-7 (subsystems/payload.yaml num_memory_segments: 8;
          the model rejects >= 8. The old '0-79' documentation was never
