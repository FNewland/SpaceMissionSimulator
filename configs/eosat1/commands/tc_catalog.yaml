  # Payload commands (func_id 26-39, extras 92-95)
  # Phase E (brief 04): full argument schema — per-field offset, unit,
  # raw<->eng calibration, range, default, enum/bit labels. RULE: no float32
  # on a NEW uplink argument; engineering quantities are fixed-point integer
  # + declared scale, so raw hex is always computable by inspection and the
  # readback matches the command bit-for-bit.
  - name: PAYLOAD_SET_MODE
    service: 8
    subtype: 1
    func_id: 26
    arg_schema_version: 1
    description: >-
      Set payload mode. Modes 1 (STANDBY), 2 (IMAGING) and 3 (CALIBRATION) all
      request the FPA cooler; mode 0 releases it. The request now drives BOTH
      the TCS cooler flag and the EPS `fpa_cooler` power line (2026-08b PL-a) —
      previously this path set a flag against a dark line and the detector
      never cooled, so FPA READY (0x0610) stayed NO forever with no error.
    readback: { param_id: 0x0600, description: "payload.mode" }
    fields:
      - name: mode
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 0
        range: { min: 0, max: 3 }
        enum:
          - { value: 0, label: "OFF", description: "Imager off, cooler released" }
          - { value: 1, label: STANDBY, description: "FPA cooler on, detector idle" }
          - { value: 2, label: IMAGING, description: "Detector integrating; capture enabled" }
          # 2026-08b PL-d. Value 2 is deliberately UNCHANGED: AOCS keys its
          # automatic desaturation inhibit on payload.mode == 2 meaning
          # IMAGING (DISPLAY_REQUESTS_AOCS.md section 3), so CALIBRATION had to
          # be a NEW value rather than a renumbering.
          - { value: 3, label: CALIBRATION, description: "Radiometric calibration; capture disabled, shutter and lamp gated by the cal sequencer" }
        description: "0=off, 1=standby, 2=imaging, 3=calibration"
  - name: PAYLOAD_SET_SCENE
    service: 8
    subtype: 1
    func_id: 27
    arg_schema_version: 1
    description: >-
      DEPRECATED — pre-set the next scene id. Superseded by
      PAYLOAD_CAPTURE's own scene_id argument, which overrides this value at
      capture time; retained for backward compatibility only.
    readback: { param_id: 0x0606, description: "payload.scene_id" }
    fields:
      - name: scene_id
        type: uint16
        offset: 1
        unit: ""
        calibration: { type: none }
        range: { min: 0, max: 65535 }
        default: 0
  - name: PAYLOAD_CAPTURE
    service: 8
    subtype: 1
    func_id: 28
    arg_schema_version: 1
    criticality: caution
    description: >-
      Trigger one image acquisition. The WHERE is set by the WHEN: schedule
      this TC with S11.4 at the target overpass. Geolocation is stamped on
      board from the propagated sub-satellite point at shutter open and
      returned in the image catalogue — it is not an argument.
    readback: { param_id: 0x060C, description: "payload.last_scene_id" }
    fields:
      - name: scene_id
        type: uint16
        offset: 1
        endian: big
        unit: ""
        calibration: { type: none }
        range: { min: 0, max: 65535 }
        default: 0
        description: >-
          Ground-assigned product identifier, later used by
          PAYLOAD_DOWNLOAD_IMAGE (29) and PAYLOAD_DELETE_IMAGE (30).
          0x0000 = let the payload auto-assign the next free id.
      - name: lines
        type: uint16
        offset: 3
        endian: big
        unit: "lines"
        calibration: { type: none }
        range: { min: 256, max: 20000 }
        default: 2048
        description: >-
          Along-track detector lines. Acquisition time = lines / line_rate_hz
          (500 Hz, subsystems/payload.yaml). Raw frame volume scales as
          (lines/2048) x (active_bands/4) x image_size_mb; 2048 lines x 4
          bands = 4.0 MB = subsystems/payload.yaml image_size_mb.
  - name: PAYLOAD_DOWNLOAD_IMAGE
    service: 8
    subtype: 1
    func_id: 29
    arg_schema_version: 1
    description: >-
      Report one stored image product. 2026-08b PL-c: the handler called the
      model and threw the result away, so no image metadata ever reached the
      ground on this func. It now answers with a TM(8,2) 20-octet product
      summary (same layout as PAYLOAD_GET_IMAGE_CATALOG's entries), or an S1.8
      refusal if the scene is not in the catalogue.
    fields:
      - name: scene_id
        type: uint16
        offset: 1
        unit: ""
        calibration: { type: none }
        range: { min: 0, max: 65535 }
        default: 0
        description: "Scene ID to download"
  - name: PAYLOAD_DELETE_IMAGE
    service: 8
    subtype: 1
    func_id: 30
    arg_schema_version: 1
    criticality: caution
    description: "Delete specific image from payload memory"
    fields:
