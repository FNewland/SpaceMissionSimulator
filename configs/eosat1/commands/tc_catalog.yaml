  - name: AOCS_SET_TORQUE_GAINS_ALL
    service: 6
    subtype: 2
    description: "Set all three AOCS torque control gains"
    fields:
      - { name: address, type: uint32, description: "Gain base address (0x20100000)" }
      - { name: gain_x, type: float32, description: "X-axis torque gain" }
      - { name: gain_y, type: float32, description: "Y-axis torque gain" }
      - { name: gain_z, type: float32, description: "Z-axis torque gain" }
  - name: AOCS_DUMP_TORQUE_GAINS
    service: 6
    subtype: 5
    description: "Dump all three AOCS torque control gains"
    fields:
      - { name: address, type: uint32, description: "Gain base address (0x20100000)" }
      - { name: length, type: uint16, description: "Dump length (12 bytes = 3 floats)" }

  # ===== S8 Function Management =====
  # AOCS commands (func_id 0-9)
  - name: AOCS_SET_MODE
    aliases: [SET_AOCS_MODE]
    service: 8
    subtype: 1
    func_id: 0
    arg_schema_version: 1
    description: "Set AOCS mode"
    readback: { param_id: 0x020F, description: "aocs.mode" }
    fields:
      - name: mode
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 4
        enum:
          - { value: 0, label: "OFF" }
          - { value: 1, label: SAFE_BOOT }
          - { value: 2, label: DETUMBLE }
          - { value: 3, label: COARSE_SUN }
          - { value: 4, label: NOMINAL_NADIR }
          - { value: 5, label: FINE_POINT, description: "Refused with TM(1,8) unless aocs.fine_ready (0x02C5) == 0" }
          - { value: 6, label: SLEW }
          - { value: 7, label: DESATURATION }
          - { value: 8, label: ECLIPSE_PROPAGATE }
          - { value: 9, label: INERTIAL }
        description: "0=off,1=safe_boot,2=detumble,3=coarse_sun,4=nominal_nadir,5=fine_point,6=slew,7=desaturation,8=eclipse_propagate,9=inertial. Mode 5 is refused with TM(1,8) unless the aocs.fine_ready (0x02C5) precondition bitmask is 0."
  - name: AOCS_DESATURATE
    service: 8
    subtype: 1
    func_id: 1
    description: "Start wheel desaturation"
    fields: []
  - name: AOCS_DISABLE_WHEEL
    service: 8
    subtype: 1
    func_id: 2
    description: "Disable specific reaction wheel"
    fields:
      - { name: wheel_idx, type: uint8, description: "Wheel index (0-3)" }
  - name: AOCS_ENABLE_WHEEL
    service: 8
    subtype: 1
    func_id: 3
    description: "Enable specific reaction wheel"
    fields:
      - { name: wheel_idx, type: uint8, description: "Wheel index (0-3)" }
  - name: ST1_POWER
    service: 8
    subtype: 1
    func_id: 4
    description: "Star tracker 1 power on/off"
    fields:
      - { name: "on", type: uint8, description: "0=off, 1=on" }
  - name: ST2_POWER
    service: 8
    subtype: 1
    func_id: 5
    description: "Star tracker 2 power on/off"
    fields:
      - { name: "on", type: uint8, description: "0=off, 1=on" }
  - name: ST_SELECT
    service: 8
    subtype: 1
    func_id: 6
    description: "Select primary star tracker"
    fields:
      # 2026-08c: the wire encoding is 1=ST1, 2=ST2 (the on-board handler
      # refuses 0) — the old "0=ST1, 1=ST2" text sent operators a refused
      # byte for ST1 and silently selected ST1 when they wanted ST2.
      - { name: unit, type: uint8, description: "1=ST1, 2=ST2 (0 is refused)" }
  # MAG_SELECT (S8 func 7) removed from the catalogue (2026-08c item 8):
  # a single magnetometer is fitted, so there is nothing to select. The
  # on-board handler survives and REFUSES with 0x0007 + an explanatory S1.8,
  # so a stale procedure that still sends func 7 gets an honest failure
  # rather than a fabricated success.
  - name: RW_SET_SPEED_BIAS
    service: 8
    subtype: 1
    func_id: 8
    description: "Set reaction wheel speed bias (added to the wheel's current speed)"
    fields:
      - { name: wheel_idx, type: uint8, description: "Wheel index 0-3" }
      - { name: bias_rpm, type: float32, description: "Speed bias in RPM, IEEE-754 big-endian" }
  - name: MTQ_ENABLE
    service: 8
    subtype: 1
    func_id: 9
    description: "Enable/disable magnetorquers"
    fields:
