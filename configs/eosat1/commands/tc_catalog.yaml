  - name: EVENT_DISABLE
    service: 5
    subtype: 6
    description: "Disable event report generation for specified event IDs"
    fields:
      - { name: event_id, type: uint16, description: "Event definition ID" }

  # ===== S6 Memory Management =====
  - name: MEM_LOAD
    aliases: [MEM_LOAD_START, MEM_LOAD_DATA, MEM_LOAD_ABORT]
    service: 6
    subtype: 2
    description: "Load data to on-board memory. Address must lie in an rw region of configs/eosat1/memory/memory_map.yaml; unmapped -> S1.8 code 0x0001, read-only -> 0x0002."
    fields:
      - { name: memory_id, type: uint8, description: "0=SRAM, 1=EEPROM (informational; the address selects the region)" }
      - { name: address, type: uint32, description: "Start address" }
      - { name: data, type: bytes, description: "Data to load" }
  - name: MEM_DUMP
    service: 6
    subtype: 5
    description: "Dump on-board memory contents"
    fields:
      - { name: memory_id, type: uint8 }
      - { name: address, type: uint32 }
      - { name: length, type: uint16 }
  - name: MEM_CHECK
    service: 6
    subtype: 9
    description: "Check on-board memory CRC"
    fields:
      - { name: memory_id, type: uint8 }
      - { name: address, type: uint32 }
      - { name: length, type: uint16 }

  # AOCS torque-gain commands (S6 mem-load/dump at fixed gain addresses).
  # S6 dispatcher decodes uint32 address + float payload (no memory_id byte).
  - name: AOCS_SET_TORQUE_GAIN_X
    service: 6
    subtype: 2
    description: "Set AOCS X-axis torque control gain"
    fields:
      - { name: address, type: uint32, description: "Gain X address (0x20100000)" }
      - { name: gain, type: float32, description: "X-axis torque gain" }
  - name: AOCS_SET_TORQUE_GAIN_Y
    service: 6
    subtype: 2
    description: "Set AOCS Y-axis torque control gain"
    fields:
      - { name: address, type: uint32, description: "Gain Y address (0x20100004)" }
      - { name: gain, type: float32, description: "Y-axis torque gain" }
  - name: AOCS_SET_TORQUE_GAIN_Z
