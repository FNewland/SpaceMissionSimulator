  # TTC commands (func_id 63-78)
  - name: TTC_SWITCH_PRIMARY
    service: 8
    subtype: 1
    func_id: 63
    description: "Switch to primary transponder"
    fields: []
  - name: TTC_SWITCH_REDUNDANT
    service: 8
    subtype: 1
    func_id: 64
    description: "Switch to redundant transponder"
    fields: []
  - name: TTC_SET_DATA_RATE
    service: 8
    subtype: 1
    func_id: 65
    description: >-
      Select a rung of the TM data-rate ladder defined in
      subsystems/ttc.yaml tm_rate_tiers. Sets data_rate_mode (the COMMANDED
      tier), which the TTC tick resolves the active tier from, so the
      commanded tier survives the tick and is authoritative. Three tiers:
      LOW 16 kbps BPSK conv(7,1/2)+RS — ROUTINE OPERATIONS, and the safe-mode
      / FDIR fallback; HIGH 128 kbps QPSK RS(255,223) — delayed-telemetry
      playback and image dumps only; SAFE 1 kbps BPSK conv(7,1/2)+RS —
      bootloader/contingency lifeline rate (renamed from BEACON, 2026-08c —
      "beacon" always means the UHF whip transmitter now), entered with
      TTC_SET_BEACON_MODE, not selectable here.
      LEGACY ENCODING PRESERVED VERBATIM: rate=0 still means "the low rate"
      and rate=1 still means "the high rate" — they now select LOW (16 kbps)
      and HIGH (128 kbps) instead of 1 kbps and 64 kbps, so existing
      procedures, OBCPs and the FDIR ttc_reduce_power action keep their
      meaning.
      Permission rules are enforced by REJECTION with an S1.8 execution
      failure (error 0x0007), never by silent clamping: HIGH requires a
      deployed antenna and DOWNLINK/dump mode (TTC_SET_DOWNLINK_MODE), and
      every tier except SAFE is refused while beacon mode is latched. An
      unknown tier code gives error 0x0003. There is NO on-board elevation
      gate (2026-08c): the 10 deg HIGH policy is a GROUND rule — the MCS
      warns when HIGH is commanded below 10 deg from its own contact
      geometry, and the planner schedules HIGH dumps above it.
    arg_schema_version: 1
    readback: { param_id: 0x0510, description: "ttc.tm_data_rate" }
    deprecated_aliases:
      - form: "rate_bps uint32 (4 B)"
        note: >-
          Legacy 4-byte big-endian raw-bps form, still accepted by the
          handler for older clients; a raw value matching a tier's bps
          selects that tier. New consumers MUST use the 1-byte tier code.
    fields:
      - name: rate
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 0
        enum:
          - { value: 0, label: LOW, description: "16 kbps BPSK conv(7,1/2)+RS - routine operations" }
          - { value: 1, label: HIGH, description: "128 kbps QPSK RS(255,223) - dumps only (gated)" }
          - { value: 255, label: SAFE, description: "1 kbps bootloader lifeline rate (ex-BEACON) - not selectable here" }
        description: "Tier code: 0=LOW(16 kbps, routine operations), 1=HIGH(128 kbps, dumps only), 255=SAFE(1 kbps, bootloader only). Codes come from tm_rate_tiers[].command_code in subsystems/ttc.yaml."
