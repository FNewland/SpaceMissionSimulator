        description: "Filter wheel position 0-3"
  - name: PAYLOAD_CYCLE_SHUTTER
    service: 8
    subtype: 1
    func_id: 93
    arg_schema_version: 1
    position: payload
    description: >-
      Run a shutter mechanism EXERCISE. This is a mechanism health test, not a
      way to reach a position — use PAYLOAD_SET_SHUTTER (func 119) for that.

      2026-08b PL-d: `cycles` counts TRANSITIONS of the blade, one per model
      tick, and the mechanism is driven entirely by the model. Previously the
      command handler toggled once AND the tick toggled once per remaining
      count, so cycles=1 moved the blade twice, the shutter always ended where
      it started, and the shutter could never be commanded closed at all.
    readback: { param_id: 0x063C, description: "payload.shutter_pos" }
    fields:
      - name: cycles
        type: uint8
        offset: 1
        unit: "transitions"
        calibration: { type: none }
        range: { min: 1, max: 100 }
        default: 1
        description: >-
          Number of blade transitions (1-100). An ODD count ends on the
          opposite position from the start; an EVEN count returns to it.
  - name: PAYLOAD_SET_SHUTTER
    service: 8
    subtype: 1
    func_id: 119
    arg_schema_version: 1
    position: payload
    criticality: caution
    description: >-
      Drive the shutter to an ABSOLUTE position.

      2026-08b PL-d: there was no absolute shutter command anywhere in this
      catalogue — PAYLOAD_CYCLE_SHUTTER was the only shutter TC, and a relative
      toggle cannot reach a KNOWN state. That is what COM-011 step 2 ("cycle to
      CLOSED, verify 0x063C == 0 within 10 s") needs, what a dark frame needs,
      and what PAYLOAD_CAPTURE now checks before acquiring.

      Idempotent: commanding CLOSED twice leaves it CLOSED. Refused (0x0007)
      when the shutter mechanism device 0x0603 is unpowered, and (0x0005) while
      a PAYLOAD_CYCLE_SHUTTER exercise is running.
    readback: { param_id: 0x063C, description: "payload.shutter_pos" }
    fields:
      - name: position
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 1
        enum:
          - { value: 0, label: CLOSED, description: "Blade across the aperture — the dark-frame configuration" }
          - { value: 1, label: OPEN, description: "Light path open — required for capture and for flat fields" }
        description: "0=closed, 1=open"
  - name: PAYLOAD_INITIATE_TRANSFER
    service: 8
    subtype: 1
    func_id: 94
    arg_schema_version: 1
    position: payload
    description: >-
      Start the on-board image transfer engine for a stored scene — the
      bridge to the S13_CREATE_TRANSFER ground workflow (textbook section 6.7).

      2026-08b PL-c: raises event 0x0610 TRANSFER_START (promised by a source
      comment and previously emitted by nothing) and answers with a TM(8,2)
      report of scene_id(2) + bytes_total(4) + blocks(4) + crc32(4) — the three
      numbers the ground needs to plan and verify a dump, all of which used to
      be computed on board and then dropped. The transfer drains at the ACTIVE
      TM information rate (0x0506) and only while the downlink is up (0x0501),
      not at the old hard-coded 10 Mbps: it stalls at loss of signal and
      resumes on the next pass.
    readback: { param_id: 0x062D, description: "payload.transfer_active" }
    fields:
      - name: scene_id
        type: uint16
        offset: 1
        unit: ""
        calibration: { type: none }
        range: { min: 1, max: 65535 }
        default: 1
        description: "Stored scene to transfer"
  - name: PAYLOAD_CAL_LAMP
    service: 8
    subtype: 1
    func_id: 95
    arg_schema_version: 1
    position: payload
    description: "Calibration lamp on/off (also reachable as S2 device 0x0602)"
    readback: { param_id: 0x0615, description: "payload.cal_lamp_on" }
    fields:
      - name: "on"
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 0
        enum:
          - { value: 0, label: "OFF" }
          - { value: 1, label: "ON" }
        description: "0=off, 1=on"

