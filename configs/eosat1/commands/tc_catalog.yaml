  # ── Phase D propulsion commands (funcs 108-118) ──
  # Brief 03 planned 85-95, but Phase C's AOCS pointing block took 85-91 and
  # 100-107 are the legacy quick actions; 108-118 is the next clean
  # contiguous block (free after this allocation: 92-99, 119-127).
  # Debris-avoidance + drag-make-up propulsion; catbed preheat reuses
  # HEATER_THRUSTER (func 42, TCS circuit 2).
  - name: PROP_SET_BURN
    service: 8
    subtype: 1
    func_id: 110
    position: propulsion
    arg_schema_version: 1
    criticality: critical
    description: "Load a manoeuvre: delta-V magnitude, direction and cut-off mode. The sim publishes the predicted burn duration (0x0B10) for FDS cross-check before arming. Must precede PROP_ARM by <= 300 s."
    readback: { param_id: 0x0B0E, description: "prop.burn_dv_cmd" }
    fields:
      - { name: dv_m_s, type: float32, offset: 1, unit: "m/s", range: { min: 0.01, max: 20.0 }, default: 0.85, description: "Delta-V magnitude, m/s (0 < dv <= 20; checked against 0x0B0C remaining)" }
      - name: direction
        type: uint8
        offset: 5
        unit: ""
        calibration: { type: enum }
        default: 0
        enum:
          - { value: 0, label: PROGRADE, description: "+X body, nominal nadir attitude" }
          - { value: 1, label: RETROGRADE, description: "Requires 180-deg yaw / INERTIAL hold" }
        description: "0=prograde (+X body, nominal nadir attitude), 1=retrograde (requires 180-deg yaw / INERTIAL hold)"
      - name: mode
        type: uint8
        offset: 6
        unit: ""
        calibration: { type: enum }
        default: 1
        enum:
          - { value: 0, label: OPEN_LOOP, description: "Timed burn" }
          - { value: 1, label: DV_CUTOFF, description: "Closed-loop dv cut-off (accelerometer-integrated within this burn only)" }
        description: "0=open-loop timed, 1=closed-loop dv cut-off (accelerometer-integrated within this burn only)"
      - { name: t_start_cuc, type: uint32, offset: 7, unit: "s(CUC)", calibration: { type: none }, default: 0, description: "Burn start CUC (0 = fire on PROP_EXECUTE; normally S11 time-tagged per NOM-004)" }

  - name: PROP_ARM
    service: 8
    subtype: 1
    func_id: 108
    position: propulsion
    arg_schema_version: 1
    criticality: critical
    description: "Arm the propulsion system (two-step: requires PROP_SET_BURN within 300 s and the arm code). Runs all interlocks — catbed >= 180 C, tank pressure band, propellant, AOCS mode/att error, SoC, phase, eclipse, valves; each failure returns a distinct S1(8) code and its bit in 0x0B15."
    readback: { param_id: 0x0B00, description: "prop.state" }
    fields:
      - { name: arm_code, type: uint16, offset: 1, unit: "", calibration: { type: none }, default: 42435, description: "Fixed arm code 0xA5C3 (= 42435); any other value is rejected" }

  - name: PROP_DISARM
