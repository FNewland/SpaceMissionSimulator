  # ===== S8 Function Management — System / mission level (func_id 120-127) =====
  # A fresh block. 99 and 119-127 were the free ids; 119 went to
  # PAYLOAD_SET_SHUTTER and 99 sits immediately below the 100-107 legacy
  # quick-action block, so the system commands open a clean contiguous range
  # at 120 rather than filling the last hole in someone else's block.
  - name: SYS_SET_MISSION_PHASE
    service: 8
    subtype: 1
    func_id: 120
    arg_schema_version: 1
    criticality: critical
    readback: { param_id: 0x0129, description: "eps.spacecraft_phase — the achieved mission phase" }
    description: >-
      Declare the mission phase. Nothing else advances the phase past 4 (LEOP):
      the on-board state machine only implements the automatic power-up chain
      1->2->3->4 and the reboot revert to 3, so COMMISSIONING (5) and NOMINAL
      (6) are ground declarations and this is the telecommand that makes them.

      WHAT THE PHASE ACTUALLY GATES — the phase is not a label, it is a live
      interlock on six mechanisms:
        * which subsystems tick at all (phases 0-1 tick nothing);
        * telecommand acceptance — at phase <= 3 the OBC is running the
          bootloader and only the bootloader command subset is accepted
          (S17.1, S9.1, S3 beacon HK, S20.1/3, S8.1 funcs 19/20/52-57/61/
          66/67/69, and this command);
        * the derived spacecraft mode — sc_mode (and its telemetered copy
          sat.mode 0x0001) is forced to SAFE at any phase < 6, so the console
          header cannot read NOMINAL until this command has been sent;
        * arming of the advanced fault-propagation model, which is disarmed
          below phase 6 because during LEOP the wheels are legitimately
          unpowered;
        * the phase-gated legacy FDIR rules (fdir.yaml `min_phase`);
        * the propulsion interlock — prop.yaml declares `min_phase: 6`, so
          with the phase stuck at 4 no burn can ever be armed.

      GUARDS. Out-of-range (> 6) is refused with 0x0C01. Phases 0-2 are
      pre-separation states owned by the launch vehicle and are never
      ground-commandable, forced or not (0x0C02) — commanding phase 0 would
      stop the subsystem ticks that carry the uplink and lock the operator
      out. Entering an application phase (>= 4) while the OBC is running the
      bootloader is refused with 0x0C03; boot the application first with
      OBC_BOOT_APP (func 55) and the state machine advances 3->4 by itself.
      A BACKWARDS transition is refused with 0x0C04 unless the FORCE flag is
      set: a real mission does not casually go NOMINAL -> LEOP, but an
      operator rehearsing a regression or unwinding a premature declaration
      must be able to, so the answer is reject-with-reason plus an explicit
      opt-in, not a blanket refusal. Every accepted change raises the S5
      event MISSION_PHASE_CHANGED (0x0055) carrying the from and to phases.
    fields:
      - name: phase
        type: uint8
        offset: 1
        calibration: { type: enum }
        default: 6
        enum:
          - { value: 3, label: BOOTLOADER_OPS, description: "OBC in bootloader, beacon HK only (backwards only, requires FORCE)" }
          - { value: 4, label: LEOP, description: "Application software booted, sequential checkout" }
          - { value: 5, label: COMMISSIONING, description: "All subsystems being checked out" }
          - { value: 6, label: NOMINAL, description: "Declared operational — unlocks sc_mode NOMINAL and the propulsion interlock" }
        description: "Target mission phase. 3-6 only; 0-2 are pre-separation states and are always refused."
      - name: flags
        type: uint8
        offset: 2
        default: 0
        description: "Bit 0 = FORCE (permit a backwards transition). Bits 1-7 reserved, must be 0."

# ═════════════════════════════════════════════════════════════════════
# Phase E (brief 04 WP-5) — the MCS QUICK COMMANDS panel, schema-driven.
# Each entry names a catalogued command plus ENGINEERING argument values;
# the hex is computed by the shared encoder (smo_common.commanding on the
# ground, the mirrored JS encoder in the MCS page) — never hand-typed.
# `name` is the send-path display name (defaults to `command`), `label`
# the button text, `group` the panel section. `critical` renders the red
# confirm-first style.
# ═════════════════════════════════════════════════════════════════════
