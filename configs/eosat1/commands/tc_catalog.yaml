  - name: AOCS_GYRO_CALIBRATION
    service: 8
    subtype: 1
    func_id: 13
    arg_schema_version: 1
    position: aocs
    description: >-
      Start (or abort) an on-board gyro bias calibration. The spacecraft
      averages the attitude filter's observed gyro bias over a quiet arc with
      the star tracker in the determination loop, then applies the result as a
      compensation on the gyro measurement path. Refused with a specific code
      if the preconditions do not hold (0x0A01 AOCS unpowered, 0x0A02 a gyro
      unit off, 0x0A03 no star-tracker reference, 0x0A04 body rate too high,
      0x0A05 already running). Progress is aocs.gyro_cal_progress (0x02CA) and
      the estimate lands in aocs.gyro_cal_bias_x/y/z (0x02CB-0x02CD). NOTE the
      description used to read "Reset gyro bias estimate", and that is exactly
      what the on-board handler did — it zeroed a truth state and returned
      success without estimating anything.
    fields:
      - name: action
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 0
        enum:
          - { value: 0, label: START }
          - { value: 1, label: ABORT }
        description: "0=START a calibration, 1=ABORT the one in progress"
      - { name: duration_s, type: uint16, offset: 2, unit: s, calibration: { type: none }, range: { min: 0, max: 1800 }, default: 0, description: "Averaging arc length. 0 = the configured default (sensors.gyro.calibration.duration_s, 300 s); other values are clamped to [30, 1800] s" }

