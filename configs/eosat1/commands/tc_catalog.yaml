  # ── UHF bootloader beacon TRANSMITTER (Franz's ruling R2, 2026-08b) ──
  # func 97/98, allocated from the free 97-99 block rather than extended out
  # of the 63-79 TT&C range on purpose: every func in 63-79 is rejected at
  # acceptance when the EPS `ttc_tx` line is off, and the beacon must stay
  # commandable exactly then. 99 remains free.
  #
  # NOT to be confused with TTC_SET_BEACON_MODE (func 70), which selects the
  # SAFE rung of the S-band TM rate ladder and touches no hardware. These
  # two switch a physically separate radio: 437.5 MHz, 1 W RF into a
  # deployable dipole, billed to the non-switchable `ttc_rx` line, carrying
  # HK SID 11 and nothing else.
  - name: TTC_BEACON_TX_ON
    service: 8
    subtype: 1
    func_id: 97
    criticality: normal
    description: >-
      Switch the UHF bootloader beacon TRANSMITTER on. This is the second
      radio, not a mode of the S-band transponder: separate band (437.5 MHz,
      in the 435-438 MHz amateur-satellite segment), separate PA (1 W RF),
      separate deployable dipole and separate link budget. It carries HK
      SID 11 only, and it keeps carrying it when the S-band prime chain is
      dead - PA off, ttc_tx line pulled, transponder failed or patch stowed.
      That independence is the entire reason a spacecraft carries one.
    readback: { param_id: 0x0526, description: "ttc.beacon_tx_on" }
    fields: []
  - name: TTC_BEACON_TX_OFF
    service: 8
    subtype: 1
    func_id: 98
    criticality: caution
    description: >-
      Switch the UHF bootloader beacon transmitter off. CAUTION: this removes
      the mission's last independent downlink. With the beacon off, an S-band
      failure leaves the spacecraft unable to tell the ground that the OBC is
      alive, and recovery depends entirely on the uplink still working. Use
      only for RFI de-confliction or a deliberate radio-silence exercise.
    readback: { param_id: 0x0526, description: "ttc.beacon_tx_on" }
    fields: []

