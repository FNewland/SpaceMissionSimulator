      - { name: p_min_bar,       type: float32, offset: 5,  unit: "bar", range: { min: 1.0, max: 22.0 },   default: 4.0,   description: "Abort below this feed pressure (default 4.0)" }
      - { name: catbed_max_c,    type: float32, offset: 9,  unit: "degC", range: { min: 200.0, max: 500.0 }, default: 350.0, description: "Abort above this catbed temperature (default 350)" }
      - { name: t_burn_max_s,    type: float32, offset: 13, unit: "s",   range: { min: 10.0, max: 600.0 }, default: 300.0, description: "Burn watchdog timeout (default 300)" }

  - name: PROP_INHIBIT_SET
