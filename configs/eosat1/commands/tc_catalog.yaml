  - name: PAYLOAD_GET_IMAGE_CATALOG
    service: 8
    subtype: 1
    func_id: 32
    description: >-
      Request the stored image catalogue. 2026-08b PL-c: this now RETURNS
      something. The handler called the model and discarded the result, so the
      one command whose entire purpose is to tell the ground what is on board
      produced no telemetry at all.

      TM(8,2) reply, built like PROP_GET_STATUS (func 118):
      shown(2) + held(2) + product_mb x100 (4) + free_mb x100 (4), followed by
      `shown` 20-octet product summaries of
      scene_id(2) lat(4, 1e-4 deg) lon(4, 1e-4 deg) size_kb(4) lines(2)
      quality(1, %) status(1, 0=OK/1=PARTIAL/2=CORRUPT) flags(1) segment(1).
      flags bit 0 = the strip was flown on a 3-wheel (degraded) FINE set,
      bit 1 = a product checksum has been computed. At most 32 summaries per
      report; `held` is the true count.
    fields: []
  - name: PAYLOAD_SET_BAND_CONFIG
    service: 8
    subtype: 1
    func_id: 33
    arg_schema_version: 1
    description: "Set spectral band enable mask"
    readback: { param_id: 0x0625, description: "payload.band_enable_mask" }
    fields:
      - name: mask
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: bitfield }
        range: { min: 1, max: 15 }
        default: 15
        bits:
          - { bit: 0, name: BLUE,  description: "443 nm, 20 nm BW, SNR 40 dB - chlorophyll-a" }
          - { bit: 1, name: GREEN, description: "560 nm, 20 nm BW, SNR 50 dB - turbidity" }
          - { bit: 2, name: RED,   description: "665 nm, 20 nm BW, SNR 48 dB - atmos. correction" }
          - { bit: 3, name: NIR,   description: "865 nm, 40 nm BW, SNR 42 dB - atmos. correction" }
          - { bit: 4, name: RESERVED, reserved: true }
          - { bit: 5, name: RESERVED, reserved: true }
          - { bit: 6, name: RESERVED, reserved: true }
          - { bit: 7, name: RESERVED, reserved: true }
        description: >-
          Each enabled band multiplies raw volume by lines x 5000 px x 2 B.
          Bit order matches SPECTRAL_BANDS[].bit in payload_basic.py.
          mask = 0x00 is REJECTED (at least one band required).
  - name: PAYLOAD_SET_INTEGRATION_TIME
    service: 8
    subtype: 1
    func_id: 34
    arg_schema_version: 1
    description: >-
      Set per-band detector integration times. Fixed point, 0.01 ms/LSB
      (was 4x float32 = 16 argument octets; now 8). Longer integration
      raises band SNR ~3 dB per doubling.
    readback: { param_id: 0x0635, description: "payload.integration_ms (average)" }
    fields:
      - name: blue_ms
        type: uint16
        offset: 1
        unit: "ms"
        raw_unit: "cs(0.01ms)"
        calibration: { type: linear, scale: 0.01 }
        range: { min: 0.1, max: 655.35 }
        raw_range: { min: 10, max: 65535 }
        default: 2.0
        description: "Blue band integration time (ms)"
      - name: green_ms
        type: uint16
        offset: 3
        unit: "ms"
        raw_unit: "cs(0.01ms)"
        calibration: { type: linear, scale: 0.01 }
        range: { min: 0.1, max: 655.35 }
        raw_range: { min: 10, max: 65535 }
        default: 2.0
        description: "Green band integration time (ms)"
      - name: red_ms
        type: uint16
        offset: 5
        unit: "ms"
        raw_unit: "cs(0.01ms)"
        calibration: { type: linear, scale: 0.01 }
        range: { min: 0.1, max: 655.35 }
        raw_range: { min: 10, max: 65535 }
        default: 2.0
        description: "Red band integration time (ms)"
      - name: nir_ms
        type: uint16
        offset: 7
        unit: "ms"
        raw_unit: "cs(0.01ms)"
        calibration: { type: linear, scale: 0.01 }
        range: { min: 0.1, max: 655.35 }
        raw_range: { min: 10, max: 65535 }
        default: 2.0
        description: "NIR band integration time (ms)"
  - name: PAYLOAD_SET_GAIN
    service: 8
    subtype: 1
    func_id: 35
    arg_schema_version: 1
    description: >-
      Set detector gain. Fixed point, 0.001x/LSB (was float32). Gain raises
      reported SNR ~1.5 dB per doubling until saturation.
    readback: { param_id: 0x0636, description: "payload.gain_code" }
    fields:
      - name: gain
        type: uint16
        offset: 1
        unit: "x"
        raw_unit: "milli-x"
        calibration: { type: linear, scale: 0.001 }
        range: { min: 0.1, max: 10.0 }
        raw_range: { min: 100, max: 10000 }
        default: 1.0
        description: "Detector gain 0.100-10.000 (raw = gain x 1000)"
  - name: PAYLOAD_COOLER_SETPOINT
    service: 8
    subtype: 1
    func_id: 36
    arg_schema_version: 1
    criticality: caution
    description: >-
      Set the FPA thermo-electric cooler regulation setpoint (drives the
      TCS-owned FPA node). Encoded as unsigned CENTI-KELVIN so a negative
      Celsius value never requires a two's-complement raw:
      raw = round((T_degC + 273.15) x 100). -15.00 degC -> 25815 = 0x64D7.
    readback: { param_id: 0x0631, description: "payload.fpa_setpoint" }
    fields:
      - name: setpoint
        type: uint16
        offset: 1
        endian: big
        unit: "degC"
        raw_unit: "cK"
        calibration: { type: linear, scale: 0.01, offset: -273.15 }
        range: { min: -20.0, max: 0.0 }
        raw_range: { min: 25315, max: 27315 }
        default: -15.0
        description: >-
          FPA regulation setpoint in degC (Peltier-class cooler envelope
          -20..0 degC, subsystems/payload.yaml). Outside the envelope the TC
          is REJECTED with S1.8 error 0x0003.
  - name: PAYLOAD_START_CALIBRATION
    service: 8
    subtype: 1
    func_id: 37
    arg_schema_version: 1
    description: >-
      Begin a radiometric calibration sequence (dark frame / flat field /
      both).

      PRECONDITIONS (2026-08b PL-d — the gate is on the OPTICS, not on a mode
      word; the old rule was "must be in IMAGING mode", which required the
      shutter to be open onto the scene before a dark frame could be asked
      for). Refused with S1.8 unless:

        * payload mode is 1 STANDBY or 3 CALIBRATION — never 0 OFF and never
          2 IMAGING (error 0x0024);
        * the FPA is thermally ready, 0x0610 == 1 (0x0025) — dark current
          roughly doubles every 6-8 K, so coefficients taken off setpoint
          describe a different detector;
        * DARK and BOTH: shutter CLOSED, 0x063C == 0 (0x0026) and the
          calibration lamp OFF, 0x0615 == 0 (0x0027);
        * FLAT: shutter OPEN and lamp ON;
        * the devices involved are powered — FPA 0x0600, shutter 0x0603, and
          the lamp 0x0602 for FLAT/BOTH (0x0007).

      A BOTH run starts in the dark configuration and the on-board sequencer
      opens the shutter and lights the lamp itself at the DARK -> FLAT
      transition; no ground step can land between two phases 15 s apart.
      Changing the optics under a running sequence ABORTS it (event 0x0612,
      reason at 0x0645) rather than completing over invalid frames.

      Completion sets the per-band coefficients; 0x0646 cal_valid_mask marks
      the bands that now have BOTH a bias and a gain, so a DARK run completes
      an earlier FLAT run and vice versa.
    readback: { param_id: 0x062A, description: "payload.cal_active" }
    fields:
      - name: mode
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 2
        enum:
          - { value: 0, label: DARK, description: "Dark frames only — shutter CLOSED, lamp OFF (produces the bias half)" }
          - { value: 1, label: FLAT, description: "Flat field only — shutter OPEN, lamp ON (produces the gain half)" }
          - { value: 2, label: BOTH, description: "Dark then flat; the sequencer drives the optics across the phase boundary" }
        description: "0=dark only, 1=flat only, 2=both (COM-011 step 2 uses DARK)"
  - name: PAYLOAD_STOP_CALIBRATION
    service: 8
    subtype: 1
    func_id: 38
    description: "Abort calibration sequence"
    fields: []
  - name: PAYLOAD_SET_COMPRESSION
    service: 8
    subtype: 1
    func_id: 39
    arg_schema_version: 1
    description: >-
      Select compression algorithm and ratio override (was a single float32
      ratio; the algorithm octet was previously unreachable over the wire).
    readback: { param_id: 0x0614, description: "payload.compression_ratio" }
    fields:
      - name: algorithm
        type: uint8
        offset: 1
        unit: ""
        calibration: { type: enum }
        default: 3
        enum:
          - { value: 0, label: NONE, description: "No compression (ratio 1.0)" }
          - { value: 1, label: CCSDS-121, description: "Lossless Rice" }
          - { value: 2, label: CCSDS-122, description: "Image DWT" }
          - { value: 3, label: CCSDS-123, description: "Multispectral predictor (default)" }
        description: "Compression algorithm"
      - name: ratio
        type: uint8
        offset: 2
        unit: "x"
        raw_unit: "deci-x"
        calibration: { type: linear, scale: 0.1 }
        range: { min: 0.0, max: 4.0 }
        raw_range: { min: 0, max: 40 }
        default: 0.0
        description: "Ratio override x10 (0 = AUTO scene-dependent 1.5-4.0; 10-40 = 1.0-4.0)"

