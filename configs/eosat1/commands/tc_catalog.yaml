  # ===== S13 Large Data Transfer =====
  - name: S13_CREATE_TRANSFER
    service: 13
    subtype: 1
    description: >-
      Create a download transfer session for a STORED image product.

      2026-08b PL-c: the session is now bound to a real catalogue entry. A
      scene that is not in the payload's image catalogue is REFUSED (S1.8
      error 0x0003 plus a TM(13,4) NAK) — previously a transfer for scene 9999
      against an EMPTY catalogue returned transfer_id 1, 4 MB and ACTIVE, so
      the ground could open, run and complete the download of an image that had
      never been taken. Use PAYLOAD_GET_IMAGE_CATALOG (S8 func 32) to see what
      is actually on board.

      The session is sized from the product's own COMPRESSED size, so `size_mb`
      is now advisory: it is ignored whenever the scene is catalogued.

      TM(13,2) response: transfer_id(2) + total_blocks(4) + crc32(4). The last
      two fields are appended, so a decoder that reads only the transfer id is
      unaffected; `crc32` is the checksum the instrument computed over the
      product at capture, and the ground should recompute it over the received
      blocks — a CORRUPT product (catalogue status 2) will not match, which is
      how a corrupted image is now diagnosable.
    fields:
      - { name: scene_id, type: uint16, description: "Scene ID to download (must be in the payload image catalogue)" }
      - { name: size_mb, type: uint16, description: "Advisory only; ignored for a catalogued scene. 0 = configured payload image size (4 MB)" }
  - name: S13_DOWNLOAD_SEGMENT
    service: 13
    subtype: 3
    description: >-
      Request one 1024-byte segment of image data. The bytes are DERIVED from
      the product (a keyed stream over the catalogue entry's data_seed), so the
      same segment requested twice is identical and the whole product
      checksums to the crc32 that S13_CREATE_TRANSFER reported. They used to be
      a `(segment_num + i) % 256` ramp identical for every scene.
    fields:
      - { name: transfer_id, type: uint16, description: "Transfer session ID" }
      - { name: segment_num, type: uint16, description: "Segment block number" }
  - name: S13_END_TRANSFER
    service: 13
    subtype: 5
    description: >-
      Complete transfer session and free resources. 2026-08b PL-c: it now
      really does free them — a session whose blocks were ALL sent deletes the
      product and returns its storage (event 0x0614, 0x0647/0x0648 fall).
      Previously nothing was freed, so a spacecraft could downlink its entire
      store and still report it full. A partial or aborted session leaves the
      product on board, which is the "the pass dropped, re-dump next orbit"
      case this service exists for.
    fields:
      - { name: transfer_id, type: uint16, description: "Transfer session ID" }
  - name: S13_REPORT_STATUS
    service: 13
    subtype: 9
    description: "Get transfer progress status"
    fields:
      - { name: transfer_id, type: uint16, description: "Transfer session ID" }

