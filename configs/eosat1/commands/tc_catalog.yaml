        type: uint16
        offset: 1
        unit: ""
        calibration: { type: none }
        range: { min: 0, max: 65535 }
        default: 0
        description: "Scene ID to delete"
  - name: PAYLOAD_MARK_BAD_SEGMENT
    service: 8
    subtype: 1
    func_id: 31
    arg_schema_version: 1
