  - { group: "HK REQUESTS (S3.27)", label: "OBDH (SID4)",    command: HK_REQUEST, name: HK_REQ_OBDH, args: { sid: 4 } }
  - { group: "HK REQUESTS (S3.27)", label: "Payload (SID5)", command: HK_REQUEST, name: HK_REQ_PLD,  args: { sid: 5 } }
