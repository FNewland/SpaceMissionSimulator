# AOCS Reset - Level 2 Recovery for Persistent AOCS Failures
# Performs a soft reset of AOCS subsystem

procedure_id: "aocs_reset"
name: "AOCS Reset"
category: "fdir_response"
description: "Level 2 recovery: AOCS subsystem reset"

steps:
  - step_id: 1
    name: "Payload Off"
    description: "Power off payload to stabilize spacecraft"
    delay_s: 0.0
    command: "s8_command"
    params:
      func_id: 26  # PAYLOAD_SET_MODE
      data: [0x00]  # mode = 0 (off)

  - step_id: 2
    name: "Disable All Reaction Wheels"
    description: "Disable all reaction wheels for safety"
    delay_s: 1.0
    command: "s8_command"
    params:
      func_id: 2  # AOCS_DISABLE_WHEEL
      data: [0x00]  # wheel 0

  - step_id: 3
    name: "Disable Wheel 1"
    description: "Disable wheel 1"
    delay_s: 1.5
    command: "s8_command"
    params:
      func_id: 2  # AOCS_DISABLE_WHEEL
      data: [0x01]  # wheel 1

  - step_id: 4
    name: "Disable Wheel 2"
    description: "Disable wheel 2"
    delay_s: 2.0
    command: "s8_command"
    params:
      func_id: 2  # AOCS_DISABLE_WHEEL
      data: [0x02]  # wheel 2

  - step_id: 5
    name: "Disable Wheel 3"
    description: "Disable wheel 3"
    delay_s: 2.5
    command: "s8_command"
    params:
      func_id: 2  # AOCS_DISABLE_WHEEL
      data: [0x03]  # wheel 3

  - step_id: 6
    name: "AOCS Rate Damping"
    description: "Enter DETUMBLE — with every wheel disabled the magnetorquers
      are the only actuator left, and DETUMBLE is the magnetic-only rate
      damper. (Unlike safe_mode_entry / emergency_power_down, mode 2 IS the
      right target HERE, because steps 2-5 have just removed the wheels this
      procedure exists to cycle. Those two files commanded mode 2 with the
      wheels healthy, which threw away the solar-array geometry for nothing;
      they now command 0x03 COARSE_SUN.)"
    delay_s: 3.0
    command: "s8_command"
    params:
      func_id: 0  # AOCS_SET_MODE
      data: [0x02]  # mode = 2 (DETUMBLE — magnetic-only rate damping)

  # A reset that only takes things away is not a recovery. Steps 7-10 bring the
  # wheels back, which is the whole point of a SOFT reset (cycle the assembly,
  # do not abandon it). Without them the procedure left the spacecraft with
  # four disabled wheels for ever: it could damp rates and sun-point on the
  # rods, but it could never return to NOMINAL, and `aocs_wheel_failure_dual`
  # stayed permanently triggered on a spacecraft whose wheels were healthy.
  # Once they are back, the model's own chain takes over —
  # DETUMBLE -> COARSE_SUN -> the mode the ground last commanded (0x0297).
  - step_id: 7
    name: "Re-enable Wheel 0"
    description: "Bring reaction wheel 0 back after the reset"
    delay_s: 8.0
    command: "s8_command"
    params:
      func_id: 3  # AOCS_ENABLE_WHEEL
      data: [0x00]

  - step_id: 8
    name: "Re-enable Wheel 1"
    description: "Bring reaction wheel 1 back after the reset"
    delay_s: 8.5
    command: "s8_command"
    params:
      func_id: 3  # AOCS_ENABLE_WHEEL
      data: [0x01]

  - step_id: 9
    name: "Re-enable Wheel 2"
    description: "Bring reaction wheel 2 back after the reset"
    delay_s: 9.0
    command: "s8_command"
    params:
      func_id: 3  # AOCS_ENABLE_WHEEL
      data: [0x02]

  - step_id: 10
    name: "Re-enable Wheel 3"
    description: "Bring reaction wheel 3 back after the reset"
    delay_s: 9.5
    command: "s8_command"
    params:
      func_id: 3  # AOCS_ENABLE_WHEEL
      data: [0x03]

# Raised from 30 s: the last step now fires at T+9.5 s and the wheels need to
# spin back up before the procedure can honestly claim to have completed.
timeout_s: 60.0
max_retries: 1
