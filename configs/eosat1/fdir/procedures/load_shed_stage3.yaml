# Load Shedding Stage 3 - Survival Mode (SoC < 10%)
# Only essential systems: OBC, TTC, battery heater, AOCS safe mode

procedure_id: "load_shed_stage3"
name: "Load Shedding Stage 3"
category: "fdir_response"
description: "Activate load shedding stage 3 - Survival mode (SoC < 10%)"

steps:
  - step_id: 1
    name: "Payload Off"
    description: "Power off payload"
    delay_s: 0.0
    command: "s8_command"
    params:
      func_id: 26  # PAYLOAD_SET_MODE
      data: [0x00]  # mode = 0 (off)

  - step_id: 2
    name: "AOCS Sun-Safe Hold"
    description: "AOCS to COARSE_SUN, the sun-safe hold, with minimal power"
    delay_s: 0.5
    command: "s8_command"
    params:
      func_id: 0  # AOCS_SET_MODE
      # 2026-08b: was [0x02] labelled "safe". Mode 2 is DETUMBLE — a
      # magnetic-only RATE DAMPER with no pointing at all, so shedding to it
      # throws away the solar-array geometry at precisely the moment the
      # battery needs it most. Mode 3 COARSE_SUN is the sun-safe hold, and it
      # is what safe_mode_entry, emergency_power_down and
      # aocs_safe_mode_recovery all command since the AOCS owner's Phase 1
      # pass. COARSE_SUN is also not an operational mode in the model, so
      # commanding it does not overwrite the ground's commanded mode (0x0297)
      # and the spacecraft hands itself back once the load shed relaxes.
      data: [0x03]  # mode = 3 (COARSE_SUN — the sun-safe hold)

  - step_id: 3
    name: "TTC Minimal Power"
    description: "Set TTC TX power to minimum (LOW, 1.0 W RF)"
    delay_s: 1.0
    command: "s8_command"
    params:
      func_id: 68  # TTC_SET_TX_POWER
      # Phase E WP-2: level 0 = LOW (1.0 W) — the survival-mode minimum.
      # The old [0x01] meant NOMINAL under the enumerated table and was in
      # any case silently ignored by the float32-era handler.
      data: [0x00]

  - step_id: 4
    name: "Battery Heater Only"
    description: "Keep only battery heater at minimal duty (10%)"
    delay_s: 1.5
    command: "s8_command"
    params:
      func_id: 46  # TCS_SET_HEATER_DUTY_LIMIT
      data: [0x00, 0x0A]  # circuit=0 (battery), max_duty=10%

  - step_id: 5
    name: "Load Shed Stage 3"
    description: "Activate load shedding stage 3"
    delay_s: 2.0
    command: "s8_command"
    params:
      func_id: 25  # EPS_EMERGENCY_LOAD_SHED
      data: [0x03]  # stage = 3

timeout_s: 30.0
max_retries: 1
