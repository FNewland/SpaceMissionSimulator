# Load Shedding Stage 2 - Triggered at SoC < 20%
# Payload off, AOCS reduced, non-essential heaters off

procedure_id: "load_shed_stage2"
name: "Load Shedding Stage 2"
category: "fdir_response"
description: "Activate load shedding stage 2 (SoC < 20%)"

steps:
  - step_id: 1
    name: "Payload Off"
    description: "Power off payload completely"
    delay_s: 0.0
    command: "s8_command"
    params:
      func_id: 26  # PAYLOAD_SET_MODE
      data: [0x00]  # mode = 0 (off)

  - step_id: 2
    name: "AOCS Sun-Safe Hold"
    description: "Transition AOCS to COARSE_SUN, the sun-safe hold"
    delay_s: 1.0
    command: "s8_command"
    params:
      func_id: 0  # AOCS_SET_MODE
      # 2026-08b: was [0x02] labelled "safe". Mode 2 is DETUMBLE — a
      # magnetic-only RATE DAMPER with no pointing at all, so shedding to it
      # throws away the solar-array geometry at precisely the moment the
      # battery needs it most. Mode 3 COARSE_SUN is the sun-safe hold, and it
      # is what safe_mode_entry, emergency_power_down and
      # aocs_safe_mode_recovery all command since the AOCS owner's Phase 1
      # pass. COARSE_SUN is also not an operational mode in the model, so
      # commanding it does not overwrite the ground's commanded mode (0x0297)
      # and the spacecraft hands itself back once the load shed relaxes.
      data: [0x03]  # mode = 3 (COARSE_SUN — the sun-safe hold)

  - step_id: 3
    name: "Disable Non-Essential Heaters"
    description: "Turn off non-essential heaters"
    delay_s: 2.0
    command: "s8_command"
    params:
      func_id: 41  # HEATER_OBC (turn off for non-essential zone)
      data: [0x00]  # off

  - step_id: 4
    name: "Load Shed Stage 2"
    description: "Activate load shedding stage 2"
    delay_s: 3.0
    command: "s8_command"
    params:
      func_id: 25  # EPS_EMERGENCY_LOAD_SHED
      data: [0x02]  # stage = 2

timeout_s: 25.0
max_retries: 2
