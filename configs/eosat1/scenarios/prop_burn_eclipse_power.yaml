name: "Manoeuvre Power Conflict at Eclipse"
difficulty: ADVANCED
duration_s: 5400
briefing: |
  A conjunction warning forces a debris-avoidance burn on a pass that runs
  into eclipse entry, on a battery already degraded by a partial array
  fault. A manoeuvre is a POWER activity: the catbed preheat is 12 W for 20
  minutes (4 Wh) on top of platform load, and the arm interlock requires
  SoC > 45% and daylight. Injected at T+300s, the array degradation drags
  the charge rate down so a carelessly-timed preheat leaves the spacecraft
  below the arm threshold at the burn epoch — the arm is refused with the
  SoC bit set in 0x0B15 (or, if forced earlier and SoC collapses to
  critical, S19 rule 8006 aborts the burn). The crew must re-time the
  preheat and burn inside the daylight/power envelope or brief the Flight
  Director that the CAM slips one orbit.
events:
  - time_offset_s: 300
    action: inject
    params:
      subsystem: eps
      failure: solar_array_partial
      magnitude: 0.5
      array: A
  - time_offset_s: 360
    action: message
    params:
      text: "CONJUNCTION ALERT: red Pc threshold. FD directs 0.20 m/s prograde CAM this pass per NOM-004/NOM-013. Watch the power budget."
expected_responses:
  - { category: detect, description: "Detect degraded charge rate and project SoC through preheat + burn; recognise the eclipse/SoC arm interlocks (0x0B15 bits 5/7)" }
  - { category: isolate, description: "Correlate SA-A current loss with the SoC trend; distinguish power shortfall from a propulsion fault" }
  - { category: recover, description: "Re-time preheat/burn inside daylight with SoC margin, or brief the FD on a one-orbit CAM slip; never defeat the interlocks" }
