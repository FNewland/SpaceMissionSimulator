# EOSAT-1 TT&C — S-band RF plan (roadmap N-4 / DI-05).
#
# The mission flies S-band: 2025–2110 MHz uplink, 2200–2290 MHz downlink
# (CCSDS 401.0-B near-Earth allocations). This matches
# configs/eosat1/planning/ground_stations.yaml (tx_freq_mhz 2025.0 /
# rx_freq_mhz 2200.0), configs/eosat1/rfsim.yaml (channel.frequency_hz
# 2200.0e6) and the course textbook. The previous UHF values (449.0 /
# 401.5 MHz) agreed with nothing else in the repo.
#
# The command-side validators now agree: ttc_basic.UL_BAND_MHZ /
# DL_BAND_MHZ are 2025–2110 / 2200–2290 and tc_catalog.yaml's
# TTC_SET_UL_FREQ / TTC_SET_DL_FREQ advertise the same bands. The old
# UHF 440–460 / 400–410 validators and the 2000–2100 / 8400–8500
# catalogue text are gone.
# ── TWO TRANSMITTERS, not one (Franz's ruling R2, 2026-08-12) ───────────
#
# This file used to assert a single radio ("the whole ladder is reachable
# with a single TT&C radio"). That was true of the *TM rate ladder* and false
# of the spacecraft: the textbook (docs/review_2026-07/textbook_inventory.md
# :46,131) has always described "S-band prime (body-fixed patch) + UHF whip
# bootloader beacon", and UPGRADE_ROADMAP.md:97 scope (d) says to retain the
# UHF numbers as the bootloader-beacon link. EO-Sat-1 therefore flies:
#
#   * the S-BAND PRIME CHAIN — this file's ul/dl_freq_mhz, tm_rate_tiers,
#     eirp_dbw, sc_gain_dbi. Carries everything: real-time HK, playback,
#     image dumps, S1 verification, on-demand reads. Dies with the PA
#     (TTC_PA_DISABLE, S8 func 67) and with the EPS `ttc_tx` line.
#   * the UHF BEACON TRANSMITTER — the `beacon:` block below. A separate
#     radio, separate band, separate antenna, separate power. Carries HK
#     SID 11 and NOTHING else, and survives the S-band PA being off. It is
#     the lifeline that answers "is the OBC alive?" when the prime chain is
#     dead, which is exactly why it is a second box on a real spacecraft.
#
# The two are gated independently — see `tx_active` (0x0525) for the S-band
# chain and `beacon_active` (0x0527) for the beacon. `beacon_mode` (0x0521)
# is a THIRD, unrelated thing: a rung of the S-band rate ladder below. Do not
# conflate them; docs/LINK_BUDGET_AND_RATES.md §9 spells the difference out.
model: ttc_basic
ul_freq_mhz: 2025.0
dl_freq_mhz: 2200.0

# ── TM data-rate ladder (defect #85) ────────────────────────────────────
#
# Replaces the old binary tm_rate_hi_bps / tm_rate_lo_bps switch. Every
# number below is CONFIG, not a code constant: change a `bps` here and the
# simulator, the S8 func-65 handler, the rate pacers and the RF pipeline
# all follow.
#
# THREE rungs, per Franz's rulings of 2026-07-29 and 2026-08c (the bottom
# rung was renamed BEACON -> SAFE; same rate, same wire values — "beacon"
# now always means the UHF whip transmitter, never a rung of this ladder):
#   SAFE    1 kbps   bootloader / contingency lifeline rate
#   LOW    16 kbps   ROUTINE OPERATIONS — where the spacecraft normally sits
#   HIGH  128 kbps   delayed telemetry and image dumps, gated and earned
#
# The ladder is modelled on Copernicus Sentinel-1's programmable S-band TM
# rates (16 / 128 / 512 kbit/s over a fixed 4 kbit/s TC uplink): the two rungs
# this mission flies are Sentinel-1's low and nominal rates exactly. 128 kbps
# is also the top of the commodity CubeSat TT&C-radio class (GomSpace NanoCom
# AX2150 96 kbps, EnduroSat 125 kbps), so the whole ladder is reachable with
# ONE S-BAND radio — no separate HIGH-RATE transmitter is implied, which is
# the right hardware story for a 6U. (Amended 2026-08b/R2: this says nothing
# about the UHF beacon transmitter, which is a separate box on a separate
# band carrying SID 11 only. "One radio for the ladder" is not "one radio on
# the spacecraft" — the earlier wording was read as the latter and that is
# how the beacon came to be modelled as rung 0 of the S-band ladder.)
#
# Why not the old 1 kbps "low" rate for routine ops: the shipped
# telemetry/hk_structures.yaml generates 1351.5 bps of PUS packets, which is
# 1557 bps of channel after RS(255,223) and TM-frame overhead. 1000 bps is
# BELOW the generation rate, so the real-time backlog could never drain.
# 1 kbps is a beacon rate, not an operations rate. 16 kbps clears real-time
# HK at 9.7 % duty and still plays back 0.85 orbits of stored HK in a 514 s
# pass, so routine operations never fall behind.
#
# Steps are 1 kbps x 2^0, 2^4, 2^7 = +12.04 dB then +9.03 dB, which is exactly
# the -10*log10(R) term in the link budget: a tier step costs 9-12 dB of
# margin. Occupied bandwidth (1.35 x symbol rate, SRRC alpha 0.35, after RS,
# the 1115/1107 frame and the r=1/2 convolutional expansion) is
# 3.1 kHz / 50 kHz / 100 kHz — 2.0 % of the 5.00 MHz per-mission allocation
# in 2200-2290 MHz at the top rung.
#
# `command_code` is the uint8 value of TTC_SET_DATA_RATE (S8 func 65)'s `rate`
# field that selects the tier. The legacy binary encoding is preserved
# verbatim: **0 = "the low rate" = LOW, 1 = "the high rate" = HIGH**. FDIR's
# ttc_reduce_power action sends 0x00 and still drops to the low operational
# rate; anything that sent 0x01 for "high rate" still gets the high rate,
# now 128 kbps instead of 64 kbps. SAFE has code 0xFF because it is not
# selectable by telecommand in nominal software — it is entered by
# TTC_SET_BEACON_MODE (func 70) or by the bootloader.
tm_rate_tiers:
  - name: SAFE               # renamed from BEACON (owner ruling 2026-08c)
    bps: 1000
    command_code: 0xFF
    modulation: BPSK          # 0=BPSK 1=QPSK 2=8PSK 3=OQPSK
    coding: CONV_RS           # conv K=7 r=1/2 + RS(255,223)
    coding_gain_db: 7.5
    # SID 11 is 28 bytes every 30 s = 7.47 bps, so 1 kbps carries it with
    # 134x headroom. Reachable ONLY from the bootloader / beacon mode.
    #
    # NOTE: this rung is the S-BAND ladder's lowest rate. It is NOT the UHF
    # beacon transmitter — that is the `beacon:` block at the foot of this
    # file, with its own band, PA, antenna and budget ("beacon" always means
    # that second radio now). This rung is what the S-band chain drops to
    # when `beacon_mode` is latched; the UHF beacon runs at its own 1 kbps
    # regardless of which rung the S-band chain is on, and keeps running
    # when the S-band PA is off altogether.
    bootloader_only: true     # renamed from beacon_only (accepted as alias)
    requires_antenna: false
  - name: LOW
    bps: 16000
    command_code: 0x00        # legacy "low rate" code
    modulation: BPSK
    coding: CONV_RS
    coding_gain_db: 7.5
    # THE ROUTINE OPERATIONS RATE, and the safe-mode / FDIR fallback. Derived,
    # not chosen: real-time HK needs 1557 bps of channel, and in a 514 s
    # maximum pass 16 kbps clears that at 9.7 % duty PLUS 906 kB = 0.85 orbits
    # of stored HK — the smallest round number at which the spacecraft neither
    # loses data nor falls behind across an orbit. Sentinel-1's low S-band TM
    # rate; sits between the AX2150's 9.6 and 19.2 kbps steps. BPSK keeps the
    # PA in constant envelope, which is what a stowed/safe-mode link wants.
    requires_antenna: false
  - name: HIGH
    bps: 128000
    command_code: 0x01        # legacy "high rate" code -> now 128 kbps
    modulation: QPSK
    coding: RS                # RS(255,223) only
    coding_gain_db: 6.0
    # Delayed-telemetry playback and image dumps ONLY. Sentinel-1's nominal
    # S-band TM rate and the top of the commodity CubeSat TT&C-radio class.
    # 4 MiB image / 128 000 bps = 262.1 s, which is 58 % of the 448 s average
    # pass in this mission's 5-station contact statistics — so an image dump
    # costs a real, schedulable fraction of a pass and pass planning stays the
    # binding lesson. Gated hard so the tier has to be earned: DOWNLINK/dump
    # mode AND elevation >= 10 deg (and the PA power/thermal cost that comes
    # with it).
    #
    # QPSK rather than BPSK at this rate is a deliberate call. The link is not
    # power-limited (35 dB of margin at 5 deg) and 5 MHz of channel is not
    # scarce (200 kHz at BPSK vs 100 kHz at QPSK), so neither lever is forced.
    # QPSK is chosen because it halves the occupied bandwidth for the same
    # information rate and makes the tier step visible on the radio — the
    # constellation, the eye and the spectrum all change — which teaches that
    # rate and modulation are independent levers. The counter-argument is
    # real: flight TT&C radios at this rate (AX2150, EnduroSat) use
    # constant-envelope GMSK/GFSK, not QPSK, and a saturated PA would prefer
    # OQPSK; set `modulation: OQPSK` here if that fidelity matters more.
    requires_antenna: true
    requires_downlink_mode: true
    # GROUND POLICY, not an on-board gate (2026-08c item 4): a real
    # spacecraft does not know its elevation as seen from a ground station,
    # so the flight software no longer refuses or demotes HIGH on elevation.
    # This number is read by the GROUND segment only — the planner schedules
    # HIGH dumps above it, and the MCS command path warns when HIGH is
    # commanded below it (from the ground's own contact geometry). Below
    # 10 deg the physics still bites honestly: cosec-scaled atmospheric
    # loss and the G/T de-rate cost real margin and raise the BER the
    # ground sees.
    min_elevation_deg: 10.0

# Tier selected on entry to each regime. Names must exist in tm_rate_tiers.
default_tier: LOW         # routine operations
beacon_tier: SAFE         # bootloader / beacon mode -> the SAFE (1 kbps) rung
safe_tier: LOW            # safe mode, FDIR fallback, antenna stowed

# Deprecated aliases. Nothing in the simulator reads these any more; they are
# retained so out-of-lane readers (smo-planner budget_tracker, MCS) keep
# working until they migrate to tm_rate_tiers. If omitted, smo_common's
# TTCConfig derives them from the ladder (lo = safe tier, hi = top tier).
tm_rate_lo_bps: 16000
tm_rate_hi_bps: 128000

# ── S-band EIRP, and why it is no longer a constant ─────────────────────
#
# `eirp_dbw` is the REFERENCE EIRP, quoted at `pa_ref_power_w` watts of RF
# output. The model now scales it with the commanded PA power:
#
#     EIRP(P) = eirp_dbw + 10*log10(P / pa_ref_power_w)
#
# Before 2026-08b this was a fixed constant, so TTC_SET_TX_POWER (S8 func 68)
# moved telemetry 0x050D and nothing else — margin, Eb/N0, BER and the whole
# RF pipeline were identical at LOW and HIGH, and FDIR's "reduce TX power"
# recovery was a no-op on the link it was supposed to protect. Selecting LOW
# (1.0 W) now costs 3.01 dB of margin and selecting HIGH (5.0 W) buys
# 3.98 dB, which is what a PA does.
#
# The reference is the NOMINAL operating point, 2.0 W RF = 33 dBm — the top
# of the EnduroSat S-Band Transceiver's published "24 to 33 dBm" output
# range, and the same 2 W RF / 11 W DC point that docs/plan_2026-08b/
# POWER_SIZING.md §2.3 sized the `ttc_tx` line's HIGH tier against. The two
# sheets now describe the same radio at the same operating point.
#
# KNOWN OPEN ITEM, deliberately not changed here: 10.0 dBW at 2 W RF implies
# 7 dB of feed-and-antenna gain ahead of the 3.0 dBi patch, which no 6U has.
# The honest absolute figure is ~3.0 dBW conducted (2 W) + 3.0 dBi = 6.0 dBW
# EIRP, i.e. every margin in docs/LINK_BUDGET_AND_RATES.md §4 is 7 dB
# optimistic. It is NOT corrected in this batch because rfsim.yaml's
# link_budget.eirp_dbw must move with it (tests/test_rfsim/
# test_rate_ladder_pipeline.py asserts the two files are equal) and rfsim.yaml
# belongs to another owner. Raised in docs/plan_2026-08b/
# DISPLAY_REQUESTS_TTC.md as a two-file change. Every rung closes with 26+ dB
# to spare either way, so the teaching content is unaffected.
eirp_dbw: 10.0
pa_ref_power_w: 2.0   # RF watts at which eirp_dbw above is quoted (= NOMINAL)
gs_g_t_db: 20.0       # Iqaluit 9 m S-band dish (planning/ground_stations.yaml)
sc_gain_dbi: 3.0

# ── S-band SSPA operating points (TTC_SET_TX_POWER, S8 func 68) ─────────
# RF output watts, not DC. The DC draw of the ttc_tx line is EPS's number
# (eps.yaml transponder_power_w / transponder_hi_power_w = 5 / 11 W, from the
# EnduroSat S-band transceiver's "Maximum transmit: 11 W @ 12 V (33 dBm)").
# These used to be code defaults in ttc_basic.py; they are configuration now
# because the EIRP is derived from them and a hardware number that drives a
# link budget must live in the hardware sheet.
#
# SECOND OPEN ITEM: 5.0 W RF out of an 11 W DC line is 45 % PAE, which no
# S-band SSPA achieves (20-35 % is the real range), and it is above the
# EnduroSat part's 33 dBm / 2 W ceiling. The researched ladder is
# 0.25 / 1.0 / 2.0 W RF. Not changed here because the level table is quoted
# verbatim in configs/eosat1/manual/09_command_reference.md, which is
# generated from tc_catalog.yaml and asserted by
# tests/test_content/test_generated_command_reference.py — a coordinated
# catalogue + regenerate + manual change owned elsewhere. Also raised in
# DISPLAY_REQUESTS_TTC.md. Because the EIRP is now DERIVED from these watts,
# retuning them is a one-line change here and the link follows.
pa_low_power_w: 1.0       # level 0 = LOW
pa_nominal_power_w: 2.0   # level 1 = NOMINAL (== pa_ref_power_w, 33 dBm)
pa_max_power_w: 5.0       # level 2 = HIGH; see the open item above

# Telecommand uplink rate. Sentinel-1's TC rate, and the value already in
# rfsim.yaml pipeline.tc_symbol_rate. This MUST be set explicitly: it used to
# default to tm_rate_hi_bps, so raising the top TM tier would silently have
# raised the *uplink* with it and changed the uplink lock timing.
tc_uplink_rate_bps: 4000

# Concatenated FEC coding gain. Moving the plan from UHF 401.5 MHz to
# S-band 2200 MHz adds 20*log10(2200/401.5) = 14.8 dB of free-space path
# loss, so the link only closes with the coding gain the mission actually
# flies: RS(255,223) contributes ~5-6 dB at BER 1e-5. 6.0 dB matches
# link_budget.coding_gain_db in configs/eosat1/rfsim.yaml. The previous
# ttc_basic default of 3.0 dB understated RS alone. Per-tier
# `coding_gain_db` above overrides this for the tier that is active.
coding_gain_db: 6.0

# ── Link-budget losses (mirror rfsim.yaml link_budget) ──────────────────
# ttc_basic used to ignore all of these, which is one reason its margins
# disagreed with rfsim's. atmospheric_loss_db is the clear-sky zenith figure;
# below 30 deg elevation it is scaled by cosec(elevation) (0.5*sin30/sin eps),
# giving 2.87 dB at 5 deg. G/T is de-rated for ground/sky noise pickup at low
# elevation: -1.5 dB below 10 deg, -0.5 dB below 30 deg.
atmospheric_loss_db: 0.5
polarization_loss_db: 0.3
implementation_loss_db: 2.0
gt_derate_below_10deg_db: 1.5
gt_derate_below_30deg_db: 0.5
# Required Eb/N0 for UNCODED BPSK/QPSK at BER 1e-5 (CCSDS/textbook 9.6 dB).
# The active tier's coding gain is credited against this, so the effective
# requirement is 9.6 - 6.0 = 3.6 dB with RS(255,223) and 9.6 - 7.5 = 2.1 dB
# with conv(7,1/2)+RS. Implementation loss is carried in the loss column
# above and must NOT be added here as well.
required_eb_n0_db: 9.6

# ══════════════════════════════════════════════════════════════════════════
# UHF BOOTLOADER BEACON TRANSMITTER (Franz's ruling R2, 2026-08-12)
# ══════════════════════════════════════════════════════════════════════════
#
# A SECOND, PHYSICALLY SEPARATE RADIO. Not a mode of the S-band transponder,
# not a rung of tm_rate_tiers. It has its own PA (TTC_BEACON_TX_ON/OFF, S8
# funcs 97/98), its own band, its own antenna, its own link budget and its own
# power draw, and it carries HK SID 11 and nothing else.
#
# Why a real spacecraft carries one: the prime chain has a long list of single
# points of failure — the S-band PA, the ttc_tx power line, the deployable
# patch, the transponder, the uplink lock chain. The beacon shares none of
# them. It is the box that tells you the OBC is alive when everything else on
# the RF side is dead, and it is the box a university ground station or an
# amateur can hear during LEOP before anybody has a 9 m dish on the pass.
#
# ── Flight hardware the numbers come from ─────────────────────────────────
#   EnduroSat UHF Type II Transceiver — 435-438 MHz, output "up to 33 dBm"
#     (2 W), typical 30 dBm (1 W); GMSK/AX.25; RX draw ~0.2 W.
#   GomSpace NanoCom AX100 — 430-440 MHz, up to 30 dBm (1 W) RF.
#   EnduroSat UHF Antenna Type II — deployable tape-spring dipole, ~0 dBi,
#     linear polarisation, omnidirectional in the plane of the dipole.
#   NASA, State of the Art of Small Spacecraft Technology, ch. 9
#     (Communications): UHF is the standard CubeSat beacon/TT&C band.
#   437.5 MHz sits in the 435-438 MHz amateur-satellite segment that IARU
#     coordinates for CubeSats; it is where a beacon is actually flown.
#
# ── The contrast that is the teaching point ───────────────────────────────
# S-band patch to a 9 m polar dish and UHF whip to a university Yagi close
# COMPLETELY differently, and the two budgets sitting side by side is the
# lesson (docs/LINK_BUDGET_AND_RATES.md §9.3):
#   * UHF wins 14.0 dB of free-space path loss (2200/437.5 = 5.03x) and 0.3 dB
#     of atmosphere,
#   * and gives back 28.0 dB of G/T (a 9 m dish at 20.0 dB/K vs a crossed
#     Yagi at -8.0 dB/K) and 3.0 dBi of spacecraft antenna gain,
#   * and pays 2.7 dB more polarisation loss, because a linear dipole on an
#     uncontrolled spacecraft against a circular ground antenna is a 3 dB
#     nominal mismatch, not the 0.3 dB of a pointed circular pair.
# Net: the beacon closes on 1 W at 1 kbps with ~27 dB, against ~46 dB for the
# S-band LOW rung at 16 kbps. Same physics, different everything else.
beacon:
  enabled: true
  # 437.5 MHz: 435-438 MHz amateur-satellite segment, IARU-coordinated,
  # where CubeSat beacons are actually flown. Deliberately far from the
  # S-band plan so a student sees two independent RF chains.
  dl_freq_mhz: 437.5
  band_mhz: [435.0, 438.0]
  # 1.0 W = 30 dBm: EnduroSat UHF Type II typical output, AX100 maximum.
  # The 2 W (33 dBm) ceiling exists but is not flown continuously on a 6U.
  rf_power_w: 1.0
  # Deployable tape-spring dipole. 0 dBi is the honest figure for an omni
  # whip once you stop quoting boresight: this antenna exists to have no
  # boresight, which is the whole point during tumbling.
  sc_gain_dbi: 0.0
  # University / amateur UHF ground station: ~16 dBic crossed Yagi over a
  # T_sys of about 300 K (sky + ground pickup + a 0.7 dB LNA) = 24.8 dBK.
  # 16.0 - 24.8 = -8.8; -8.0 dB/K adopted as the round figure for a decent
  # station. The 9 m S-band dish is 20.0 dB/K — 28 dB better.
  gs_g_t_db: -8.0
  bps: 1000
  # conv(7,1/2) + RS(255,223), the same concatenation the S-band SAFE rung
  # uses. A beacon is the last thing you want uncoded.
  coding_gain_db: 7.5
  required_eb_n0_db: 9.6
  # UHF is far below the water-vapour and oxygen lines: 0.2 dB at zenith
  # against S-band's 0.5 dB, scaled by cosec(elevation) below 30 deg.
  atmospheric_loss_db: 0.2
  # 3.0 dB, not 0.3: linear dipole vs circular ground antenna is a 3 dB
  # nominal mismatch and the spacecraft may be tumbling. This is the term
  # that pays back a chunk of the path-loss advantage.
  polarization_loss_db: 3.0
  implementation_loss_db: 2.0
  # DC while keying, from the EnduroSat UHF Type II TX figure at 30 dBm.
  # Duty is tiny: SID 11 is 28 bytes at 1000 bps = 0.224 s every 30 s =
  # 0.75 %, so the orbit-average TX draw is 0.013 W. The receiver-side
  # standby is the number that actually matters, and eps.yaml already books
  # it — POWER_SIZING.md §3 lists transponder_rx_power_w = 1.5 W as
  # "EnduroSat idle/Rx 1.2 W + ~0.3 W UHF beacon Rx". The beacon therefore
  # needs NO eps.yaml change; see DISPLAY_REQUESTS_TTC.md for the arithmetic.
  dc_power_w: 1.8
  standby_dc_power_w: 0.2
  # The EPS line the beacon is billed to. `ttc_rx` is the NON-SWITCHABLE
  # receiver line, and that is the correct place: a lifeline beacon that an
  # operator could accidentally de-energise with a power-line command is not
  # a lifeline. TTC_BEACON_TX_OFF can silence it; POWER_LINE_OFF cannot.
  eps_line: ttc_rx
  # HK SID the beacon carries, and nothing else.
  hk_sid: 11

param_ids:
  ttc_mode: 0x0500
  link_status: 0x0501
  rssi: 0x0502
  link_margin: 0x0503
  ul_freq: 0x0504
  dl_freq: 0x0505
  tm_data_rate: 0x0506
  xpdr_temp: 0x0507
  ranging_status: 0x0508
  range_km: 0x0509
  contact_elevation: 0x050A
  contact_az: 0x050B
  # ── Downlink gating (2026-08b T-a) and the UHF beacon (R2) ──
  # 0x0523 was already taken by ttc.active_gs, so tx_active is 0x0525.
  tx_active: 0x0525
  beacon_tx_on: 0x0526
  beacon_active: 0x0527
  beacon_link_margin: 0x0528
  beacon_dl_freq: 0x0529
  beacon_tx_power: 0x052A
  tx_gate_status: 0x052B
  eirp_dbw: 0x052C
