model: aocs_basic
# NOTE (2026-08 epoch/altitude ruling): orbit.yaml now records the TLE-true
# ~513 km mean altitude (the 450 km declaration was retired). Derivation
# comments in this file that say "450 km" were computed at the old figure and
# are deliberately NOT re-derived here: at 513 km the gravity-gradient and
# magnetic terms change by only a few percent, while the aerodynamic torque
# roughly halves (conservative as configured). Values unchanged.
modes: [nominal, detumble, safe, wheel_desat, slew]

# ═══════════════════════════════════════════════════════════════════════
# Phase C spacecraft definition (brief 02 §Proposed model, re-derived for
# the Phase B 6U-class EO-Sat-1: ~12 kg, deployed wings 2 x 0.15 m²).
# DECISIONS.md §4 resolution: the reaction-wheel momentum budget is derived
# from a real current-production 6U-class wheel datasheet, not from either
# of the two prior contradictory numbers (book 1.5e-5 / sim 5e-3 kg·m²).
# ═══════════════════════════════════════════════════════════════════════

mass_properties:
  mass_kg: 12.0
  # 6U (0.1 x 0.2 x 0.3 m) at 12 kg with deployed wings on ±Y; +Z is the
  # payload boresight (nadir in NOMINAL). Small products of inertia.
  inertia_kgm2:
    - [0.180,  0.002, -0.003]
    - [0.002,  0.150,  0.001]
    - [-0.003, 0.001,  0.060]

reaction_wheels:
  # Anchor: Rocket Lab (Sinclair Interplanetary) RW-0.03 class — a current-
  # production 6U/12U reaction wheel: 30 mN·m·s momentum storage, 2 mN·m
  # peak torque, ~185 g, steel flywheel. Rotor inertia derived from the
  # datasheet momentum at the 5500 rpm speed limit:
  #   I_w = 0.030 N·m·s / (5500 rpm · 2π/60) = 5.2e-5 kg·m²
  # Axis authority (pyramid az 45/135/225/315°, el 30°):
  #   X/Y ≈ 2·cos30·cos45·h = 0.037 N·m·s per axis, Z ≈ 2·h = 0.060 N·m·s
  count: 4
  geometry: pyramid            # az 45/135/225/315 deg, el 30 deg above XY
  max_speed_rpm: 5500
  nominal_speed_rpm: 1200      # bias speeds [+,-,+,-]: zero net momentum
  desaturation_speed_rpm: 200
  rotor_inertia_kgm2: 5.2e-5
  max_torque_nm: 0.002
  motor_tau_s: 0.05
  coulomb_friction_nm: 2.0e-6
  viscous_friction_nm_per_rads: 1.0e-8

magnetorquers:
  # Anchor: NewSpace Systems NCTR-M016 class rod, 1.6 A·m² — a standard
  # 6U-class magnetorquer. τ = m x B ≈ 4.8e-5 N·m at 30 µT.
  #
  # CORRECTED 2026-08b. The old comment here claimed "dumps a full 0.02 N·m·s
  # wheel loading in ~5-8 min". That is the INSTANTANEOUS-torque figure
  # (0.020 / 4.8e-5 = 417 s) and it is not achievable, because τ = m x B is
  # always PERPENDICULAR to B: only the component of the stored momentum
  # perpendicular to the local field can be removed at any instant, and the
  # rest has to wait for the field to sweep. Measured on this model with the
  # 0.020 N·m·s reference loading (tools: /tmp gain sweep, 1 s ticks,
  # 450 km SSO): 0.020 -> 0.005 N·m·s in 1521 s (25 min), -> 0.001 N·m·s in
  # 2857 s (48 min). The honest specification is therefore
  #   "20-50 min for a full 0.02 N·m·s dump; 5-8 min only for the
  #    perpendicular component".
  # manual §6.1 needs the same correction (textbook owner, Phase 7).
  count: 3
  max_dipole_am2: 1.6
  # B-dot detumble gain [A.m2 per (T/s)]. tau = m x B with m = -k*Bdot gives a
  # rate time constant I/(k|B|^2): 0.18/(5e5 * 9e-10) = 400 s at |B| = 30 uT.
  # Swept on the model from a 14 deg/s separation tumble: k = 5e5 reaches the
  # 0.5 deg/s DETUMBLE exit guard in 4322 s (0.76 orbit) with the rods at
  # 0.77 A.m2 mean; k = 1.5e6 is WORSE (4914 s) because the higher gain
  # amplifies differentiated magnetometer noise faster than it adds damping,
  # and k = 4e6 does not converge at all.
  bdot_gain_am2_per_tps: 5.0e5

  desaturation:
    # Cross-product momentum dump: m = k·(h_body x B)/|B|²  ⇒  τ = −k·h_perp.
    # k is a RATE, s⁻¹, and the ONLY sensible scale for it is the rate at which
    # the geomagnetic field direction sweeps through the body, ω_B ≈ 2Ω ≈
    # 2.2e-3 s⁻¹ at 450 km.
    #
    # The shipped value was k = 1.0 s⁻¹ — ~450x ω_B. When k >> ω_B the law
    # nulls h_perp faster than the field moves, the momentum vector LOCKS onto
    # B̂ and simply rides with it, and the surviving secular decay collapses to
    # ~ω_B²/k. Measured at k = 1.0: with the 0.020 N·m·s reference loading the
    # dump NEVER reached 0.005 N·m·s within a full orbit, and the rods idled at
    # 0.11-0.46 A·m² (7-29 % of capability) because nearly all of the torque
    # was being spent dragging h around with the field rather than removing it.
    #
    # k = 0.002 (≈ 1.8·ω_B) is the measured optimum of the two competing
    # asymptotes (k/ω_B² when locked, 2/k when free-running).
    gain_per_s: 0.002
    # Stop below this body momentum instead of chattering the rods about zero.
    deadband_nms: 5.0e-4
    # Give up and hand control back (event AOCS_DESAT_INEFFECTIVE 0x020E)
    # rather than parking in DESAT for ever. 3600 s ≈ 0.63 orbit, comfortably
    # longer than the 48 min worst measured dump but bounded.
    timeout_s: 3600.0
    # Bang-bang alternative: scale the commanded dipole UP to the rod envelope
    # so the rods always run flat out. MEASURED AND REJECTED — it removes
    # h_perp even faster than the linear law, so it locks onto B̂ harder: with
    # saturate_rods the reference dump never reached 0.005 N·m·s at ANY gain
    # while burning 1.69 A·m² mean. Kept as a config switch because it is a
    # good demonstration of why "run the actuator harder" is the wrong answer
    # to a geometry-limited problem.
    saturate_rods: false

disturbances:
  # 450 km SSO, 6U with deployed wings. Magnitudes (each bounded in
  # tests/test_simulator/test_aocs_dynamics.py):
  #   gravity gradient ≤ 3µ/R³·ΔI ≈ 4.5e-7 N·m (45° off-nadir)
  #   aero ≈ ½ρv²·Cd·A·d ≈ 2.3e-7 N·m   (secular in LVLH)
  #   residual dipole ≈ |m|·B ≈ 5e-7 N·m (cyclic)
  #   SRP ≈ P·Cr·A·d ≈ 1.1e-7 N·m, zero in eclipse
  residual_dipole_am2: [0.008, -0.005, 0.006]   # |m| ≈ 0.011 A·m²
  drag_area_m2: 0.06
  cp_cg_offset_m: 0.03
  srp_area_m2: 0.34
  cd: 2.2
  cr: 1.5
  rho_kgm3: 2.0e-12

integration:
  # RK4 on (q, ω) at fixed h; sub-stepped N = ceil(dt/h) capped. Stability
  # margin at h=0.5: fastest closed-loop mode ωn=0.08 → ωn·h = 0.04 vs the
  # RK4 limit 2.83 (70x). Above `secular_above_speed` the fast loop is
  # bypassed (SECULAR mode, event 0x020D, telemetry 0x02C6).
  h_s: 0.5
  max_substeps: 120
  secular_above_speed: 60.0

sensors:
  star_tracker:
    # Anchor: Blue Canyon NST (nano star tracker) class: NEA 6″ cross-
    # boresight / 40″ about-boresight (1σ), thermoelastic LF bias ≈8″ 3σ
    # (1/e ≈ 1 orbit), mounting misalignment 15″. 4 Hz in FINE, 1 Hz else.
    nea_cross_arcsec: 6.0
    nea_roll_arcsec: 40.0
    lf_bias_arcsec: 3.0        # 1σ per axis (≈ 8″ 3σ)
    misalign_arcsec: 15.0
  gyro:
    # Anchor: tactical-grade IMU flown on 6U missions (Epson M-G370 /
    # Sensonor STIM class; manual §2.1 calls the unit fibre-optic):
    # ARW 0.06°/√h = 0.001 °/√s, bias instability ~0.1°/h.
    arw_dps_rtsec: 0.001
    bias_tau_s: 1800.0
    bias_ss_dps: 2.8e-5        # 0.1 deg/h steady-state bias sigma
    noise_dps: 0.0005          # post-filter per-sample floor
    # These two were declared here but the TRUTH model ignored them: it ran a
    # free random walk that reached ~11 deg/h of bias in an hour, ~100x the
    # process noise the MEKF is built from. The estimate therefore walked 6.8°
    # off truth during a single eclipse while the filter reported 0.29° 3σ —
    # which is what tripped `aocs.att_error > 5` and demoted the spacecraft out
    # of NOMINAL every orbit. The truth bias is now the Gauss-Markov these two
    # numbers describe.
    #
    # Measurement range. A tactical-grade unit clips here, so a violent
    # separation tumble genuinely loses rate knowledge — the reason DETUMBLE
    # is specified on the magnetometer, not on the gyro.
    max_rate_dps: 400.0
    # Bias temperature coefficient about the 22 °C calibration point. Makes
    # the existing 0x0273 gyro_temp telemetry mean something: a 30 K excursion
    # is worth 6e-5 deg/s ≈ 0.2 deg/h, the same order as the bias instability.
    tempco_dps_per_k: 2.0e-6
    # Angle random walk attributed to a body axis with NO rate measurement
    # (unit powered off, or channel saturated). The MEKF uses this so the
    # covariance grows honestly instead of claiming arcsecond knowledge from a
    # dead channel.
    dead_axis_arw_dps_rtsec: 0.1
    # ── On-board gyro bias calibration (S8.1 func 13) ──
    # A real bias calibration averages the observed bias over a quiet arc
    # against a stable attitude reference; it does not complete instantly.
    # These are the preconditions and the arc length COM-003 flies.
    calibration:
      # Default averaging arc. AOCS_GYRO_CALIBRATION may override per command
      # (duration_s field, 0 = use this default); clamped to [min, max].
      duration_s: 300.0
      min_duration_s: 30.0
      max_duration_s: 1800.0
      # Refuse (0x0A04) above this body rate: the bias is only separable from
      # the true rate when the vehicle is quiescent. COM-003 flies a
      # sun-pointing hold, which sits an order of magnitude below this.
      max_rate_dps: 0.10
      # Samples are only accumulated once the filter's bias state has had time
      # to respond; the first `settle_s` of the arc are discarded.
      settle_s: 30.0

num_wheels: 4
attitude_error_deadband_deg: 0.005   # FINE control deadband (real, WP-6)

# R3 (Franz, 2026-08b): FINE_POINT runs on THREE wheels. A pyramid is flown
# four-of-four exactly so that any three still span R³ — every 3-of-4 subset of
# this geometry has condition number 2.175. Measured: 3-wheel FINE holds
# 0.0188 deg mean pointing error against 0.0208 deg on four wheels, with a peak
# per-wheel torque of 4.4 µN·m against the 2 mN·m wheel limit (~450x margin).
# What the degraded set really loses is the NULL SPACE: bias-speed regulation
# and zero-crossing avoidance are unavailable, so short-term jitter is worse.
# The mode is therefore permitted and flagged (aocs.fine_degraded, 0x0299) with
# the control deadband relaxed 4x (aocs_basic._fine_degraded_db_factor —
# AOCSConfig is a StrictModel with no free-form slot for it, so it lives in the
# model with this derivation as its documentation).

param_ids:
  att_q1: 0x0200
  att_q2: 0x0201
  att_q3: 0x0202
  att_q4: 0x0203
  rate_roll: 0x0204
  rate_pitch: 0x0205
  rate_yaw: 0x0206
  rw1_speed: 0x0207
  rw2_speed: 0x0208
  rw3_speed: 0x0209
  rw4_speed: 0x020A
  mag_x: 0x020B
  mag_y: 0x020C
  mag_z: 0x020D
  aocs_mode: 0x020F
  gps_lat: 0x0210
  gps_lon: 0x0211
  gps_alt: 0x0212
  # GPS ECEF PVT block (2026-08c item 2). The old gps_vx/vy/vz mapping to
  # 0x0213-0x0215 collided with aocs.css_sun_confidence (0x0215) and wrote
  # TRUTH velocity to undeclared ids; the measured ECEF solution now lives
  # in the catalogue block 0x0231-0x0236 (HK SID 12).
  gps_ecef_x: 0x0231
  gps_ecef_y: 0x0232
  gps_ecef_z: 0x0233
  gps_vel_x: 0x0234
  gps_vel_y: 0x0235
  gps_vel_z: 0x0236
  solar_beta: 0x0216
  att_error: 0x0217
  rw1_temp: 0x0218
  rw2_temp: 0x0219
  rw3_temp: 0x021A
  rw4_temp: 0x021B
  slew_state: 0x0292
