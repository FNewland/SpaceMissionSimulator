# Legacy (threshold) FDIR rule set, evaluated every tick by
# Engine._tick_fdir(). The advanced fault-propagation model lives in
# fdir/fault_propagation.yaml and is a separate mechanism.
#
# `min_phase:` (optional, default = no gate) — the lowest spacecraft phase in
# which the rule is ARMED. Phases: 0 PRE_SEPARATION, 1 SEPARATION_TIMER,
# 2 INITIAL_POWER_ON, 3 BOOTLOADER_OPS, 4 LEOP, 5 COMMISSIONING, 6 NOMINAL.
#
# Almost every rule here is hardware protection — battery SoC and bus voltage,
# battery/OBC/wheel/PA temperature, reboot count, CAN bus — and stays ungated
# on purpose: LEOP is precisely when a mishandled spacecraft flattens its
# battery, and a blanket `phase >= 6` on the whole file would switch those
# protections off for the entire early mission.
#
# A `min_phase` belongs only on a rule whose trigger condition IS the expected
# state of an uncommissioned spacecraft. Two rules qualify; both are annotated
# below.
enabled: true
rules:
  - parameter: eps.bat_soc
    condition: "< 20"
    threshold: 20.0
    level: 1
    action: payload_poweroff
  - parameter: eps.bat_soc
    condition: "< 15"
    threshold: 15.0
    level: 2
    action: safe_mode_eps
  # Phase B (brief 01 F9 / WP-6): 26.0 -> 24.5 V. 26.0 V is ~58 % SoC on the
  # configured OCV curve — INSIDE the nominal eclipse band — so the harshest
  # protection fired first, during correct operations. 24.5 V is ~39 % SoC:
  # below the 25.0 V in-model shed (45.5 %), above the SoC stages (30/20/10 %).
  - parameter: eps.bus_voltage
    condition: "< 24.5"
    threshold: 24.5
    level: 2
    action: safe_mode_eps
  - parameter: tcs.temp_battery
    condition: "> 42"
    threshold: 42.0
    level: 1
    action: heater_off_battery
  - parameter: tcs.temp_battery
    condition: "< 1"
    threshold: 1.0
    level: 1
    action: heater_on_battery
  - parameter: aocs.att_error
    condition: "> 5"
    threshold: 5.0
    level: 2
    action: safe_mode_aocs
    # Phase C: with real dynamics a commanded acquisition/slew holds
    # att_error above 5° for up to ~4 min (120° at the 0.5°/s cap); only a
    # SUSTAINED excursion is an anomaly. safe_mode_aocs now commands
    # COARSE_SUN (sun-safe), not DETUMBLE.
    persist_s: 420.0
    # Armed only once commissioned. Before phase 6 a large attitude error is
    # the expected state, not an anomaly: the spacecraft detumbles from
    # separation tip-off rates in LEOP and is deliberately slewed around
    # during AOCS commissioning (COM-004/COM-005/COM-013). Left ungated the
    # rule fires ~7 minutes into every run and demotes aocs.mode back to
    # COARSE_SUN under the operator, which is the "AOCS never reaches
    # NOMINAL" half of the SAFE-mode lock-in. Attitude performance is what
    # this rule protects, and attitude performance is only a requirement once
    # the spacecraft is declared operational.
    min_phase: 6
  - parameter: obdh.temp
    condition: "> 65"
    threshold: 65.0
    level: 2
    action: safe_mode_obc
  - parameter: obdh.reboot_count
    condition: "> 4"
    threshold: 4.0
    level: 3
    action: spacecraft_emergency
  - parameter: aocs.rw1_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw1
  - parameter: aocs.rw2_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw2
  - parameter: aocs.rw3_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw3
  - parameter: aocs.rw4_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw4

  # Additional cascading fault rules

  # Phase B (brief 01 F9 / WP-6): 24.0 -> 23.2 V (~22 % SoC), so AOCS safing
  # sits between SoC stage 1 (30 %) and stage 2 (20 %) — a strictly monotonic
  # protection ladder: shed 45.5 % > EPS-safe 39 % > stage-1 30 % >
  # AOCS-safe 22 % > stage-2 20 % > stage-3 10 %.
  - parameter: eps.bus_voltage
    condition: "< 23.2"
    threshold: 23.2
    level: 2
    action: safe_mode_aocs
    description: "Critical undervoltage triggers AOCS safe mode"

  - parameter: tcs.temp_battery
    condition: "> 50"
    threshold: 50.0
    level: 2
    action: payload_poweroff
    description: "Battery overtemp triggers payload power-off"

  - parameter: aocs.wheels_enabled
    condition: "< 2"
    threshold: 2.0
    level: 2
    action: safe_mode_aocs
    description: "Multi-wheel failure triggers safe mode"
    # Armed only once commissioned. The bootloader powers the spacecraft up
    # with all four wheels disabled (Engine._enter_bootloader_mode), and
    # mission.yaml boots into the bootloader on every run, so aocs.wheels_
    # enabled (0x0260) is legitimately 0 on the first tick AOCS runs. Ungated,
    # this level-2 rule latched on tick 1 of every session, pinned sc_mode to
    # SAFE for the rest of the run and re-demoted aocs.mode out of NOMINAL —
    # and because it re-triggers the instant it clears, no procedure could
    # recover it. This is the identical deadlock the advanced fault model
    # documents for aocs_wheel_failure_dual. Wheels are enabled by explicit
    # command (AOCS_ENABLE_WHEEL, S8.1 func 3) in COM-004; powering the EPS
    # aocs_wheels line does NOT enable them.
    min_phase: 6

  - parameter: obdh.can_bus_status
    condition: "< 1"
    threshold: 1.0
    level: 3
    action: spacecraft_emergency
    description: "CAN bus loss triggers emergency mode"

  - parameter: ttc.pa_temp
    condition: "> 75"
    threshold: 75.0
    level: 1
    action: safe_mode_eps
    description: "TTC PA overtemp reduction triggered"
