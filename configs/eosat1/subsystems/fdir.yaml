enabled: true
rules:
  - parameter: eps.bat_soc
    condition: "< 20"
    threshold: 20.0
    level: 1
    action: payload_poweroff
  - parameter: eps.bat_soc
    condition: "< 15"
    threshold: 15.0
    level: 2
    action: safe_mode_eps
  # Phase B (brief 01 F9 / WP-6): 26.0 -> 24.5 V. 26.0 V is ~58 % SoC on the
  # configured OCV curve — INSIDE the nominal eclipse band — so the harshest
  # protection fired first, during correct operations. 24.5 V is ~39 % SoC:
  # below the 25.0 V in-model shed (45.5 %), above the SoC stages (30/20/10 %).
  - parameter: eps.bus_voltage
    condition: "< 24.5"
    threshold: 24.5
    level: 2
    action: safe_mode_eps
  - parameter: tcs.temp_battery
    condition: "> 42"
    threshold: 42.0
    level: 1
    action: heater_off_battery
  - parameter: tcs.temp_battery
    condition: "< 1"
    threshold: 1.0
    level: 1
    action: heater_on_battery
  - parameter: aocs.att_error
    condition: "> 5"
    threshold: 5.0
    level: 2
    action: safe_mode_aocs
    # Phase C: with real dynamics a commanded acquisition/slew holds
    # att_error above 5° for up to ~4 min (120° at the 0.5°/s cap); only a
    # SUSTAINED excursion is an anomaly. safe_mode_aocs now commands
    # COARSE_SUN (sun-safe), not DETUMBLE.
    persist_s: 420.0
  - parameter: obdh.temp
    condition: "> 65"
    threshold: 65.0
    level: 2
    action: safe_mode_obc
  - parameter: obdh.reboot_count
    condition: "> 4"
    threshold: 4.0
    level: 3
    action: spacecraft_emergency
  - parameter: aocs.rw1_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw1
  - parameter: aocs.rw2_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw2
  - parameter: aocs.rw3_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw3
  - parameter: aocs.rw4_temp
    condition: "> 65"
    threshold: 65.0
    level: 1
    action: disable_rw4

  # Additional cascading fault rules

  # Phase B (brief 01 F9 / WP-6): 24.0 -> 23.2 V (~22 % SoC), so AOCS safing
  # sits between SoC stage 1 (30 %) and stage 2 (20 %) — a strictly monotonic
  # protection ladder: shed 45.5 % > EPS-safe 39 % > stage-1 30 % >
  # AOCS-safe 22 % > stage-2 20 % > stage-3 10 %.
  - parameter: eps.bus_voltage
    condition: "< 23.2"
    threshold: 23.2
    level: 2
    action: safe_mode_aocs
    description: "Critical undervoltage triggers AOCS safe mode"

  - parameter: tcs.temp_battery
    condition: "> 50"
    threshold: 50.0
    level: 2
    action: payload_poweroff
    description: "Battery overtemp triggers payload power-off"

  - parameter: aocs.wheels_enabled
    condition: "< 2"
    threshold: 2.0
    level: 2
    action: safe_mode_aocs
    description: "Multi-wheel failure triggers safe mode"

  - parameter: obdh.can_bus_status
    condition: "< 1"
    threshold: 1.0
    level: 3
    action: spacecraft_emergency
    description: "CAN bus loss triggers emergency mode"

  - parameter: ttc.pa_temp
    condition: "> 75"
    threshold: 75.0
    level: 1
    action: safe_mode_eps
    description: "TTC PA overtemp reduction triggered"
