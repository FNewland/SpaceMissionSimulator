model: eps_basic
technology: triple_junction_gaas

# NOTE: the legacy two-array `arrays:` block (2 x 0.314 m2) is GONE. It was
# dead config for generation (superseded by solar_panels below) but was still
# silently used as the expected-power reference for the "solar array degraded"
# event, which therefore fired on the first sunlit tick of every run
# (Phase B / brief 01 F11, WP-10, WP-13).

battery:
  type: li_ion
  # 2026-08b R1 re-derivation: HELD at 100 Wh, now against a named flight part
  # rather than a range. GomSpace NanoPower BPX, 8S-1P: 100 Wh, 3 Ah,
  # 28.8 V nominal, 93x86x41 mm, ~500 g, 18650 Li-ion cells. That is the
  # single-pack configuration a 6U flies; nothing here needed to change.
  # (docs/plan_2026-08b/POWER_SIZING.md, row "battery".)
  capacity_wh: 100.0
  voltage_nom: 26.4
  soc_100_v: 29.2
  soc_0_v: 21.5
  internal_r_ohm: 0.05
  # Li-ion coulombic efficiency (brief 01 F19 / WP-4).
  charge_efficiency: 0.94
  discharge_efficiency: 1.0
  # Charge power tapers linearly to zero between this SoC and 100 % (CV phase).
  cv_taper_start_soc_pct: 90.0

# Bare cell efficiency of the triple-junction GaAs cells.
cell_efficiency: 0.295

# Array performance loss stack (brief 01 F1 / WP-1). Replaces the bare
# cell_eff x MPPT model, which was a beginning-of-life number 45 % optimistic
# against any defensible EOL figure. Effective plane-of-array constant:
#   K = 1361 x 0.295 x 0.85 x [1 - 0.0020x(65-28)] x 0.97(MPPT) x 0.95
#     x sa_age_factor  =  292 W/m2 BOL, 267.9 W/m2 at 3-year EOL.
# EOL aging is carried live by sa_age_factor (annual_degradation and
# design_life_years document the sizing case used by tools/power_budget.py).
array_losses:
  inherent_degradation: 0.85   # cell mismatch, cover glass, packing, assembly
  temp_coeff_per_c: -0.0020    # TJ GaAs power coefficient
  temp_ref_c: 28.0
  array_temp_sunlit_c: 65.0    # until wired to the TCS panel zones
  harness_efficiency: 0.95
  # 2026-08b: 0.00275 -> 0.0275. The old value was 0.275 %/yr — a factor of
  # ten below the 2.75 %/yr its own comment, the K figure above (0.92 at
  # 3-year EOL) and the generation tests all assumed, and the model ignored it
  # entirely in favour of a hard-coded per-hour constant. eps_basic now
  # DERIVES its live per-sunlit-hour rate from this key, so it is load-bearing
  # rather than decorative: 0.0275 / (8760 x 0.65 sunlit) = 4.83e-6 /h.
  annual_degradation: 0.0275   # 2.75 %/yr, TJ GaAs in LEO
  design_life_years: 3.0       # sizing case = EOL (sa_age_factor 0.9175)

# Phase B rebalance (brief 01 WP-3): OBC 15 -> 6 W. 15 W of always-on OBC on a
# 6U was fiction; 6 W = OBC 3 W + PDU/EPS housekeeping 3 W.
# NOTE (2026-08b): the per-subsystem power breakdown splits this line 3 W
# OBDH / 3 W PDU-EPS housekeeping when attributing 0x0141 vs 0x013C. The
# split lives in eps_basic.EPSBasicModel.EPS_HOUSEKEEPING_SHARE_W because the
# smo-common EPSConfig schema forbids extra keys here.
obc_power_w: 6.0

# Body-mounted panels + deployable wings on the +/-Y faces, single-axis solar
# array drive about body Z (= orbit normal). 6U CDS envelope 100x226x366 mm —
# a box has only ONE pair of each face size (brief 01 F13); packing factors
# 73-82 %. -Z carries the imager aperture and radiator: no cells.
solar_panels:
  px_area_m2: 0.060    # 366x226 face, 73% packing
  mx_area_m2: 0.060
  py_area_m2: 0.030    # 366x100 face, 82% packing
  my_area_m2: 0.030
  pz_area_m2: 0.018    # 226x100 face, 80% packing
  mz_area_m2: 0.000    # imager aperture + radiator — no cells
  # 2026-08b R1 ("a 6U ... would struggle to generate 114 W peak"): 0.180 ->
  # 0.120 m2 of CELLS per wing, sized off a named flight product instead of a
  # margin target. Endurosat 6U Deployable Solar Array, double-deployable
  # configuration: 2 folding panels of 209x342 mm per wing = 0.143 m2
  # geometric, ~84 % cell packing => 0.120 m2 of cells; ~1.07 kg per wing
  # assembly including hinges and HDRM.
  #
  # Cross-check against the two independent published ratings for this class:
  #   * MMA eHaWK (6U+) "starts at 72 W" (NASA SoA of Small Spacecraft Tech,
  #     ch. 3). Ours: 2 x 0.120 m2 x 292 W/m2 = 70.1 W BOL at beta = 0. Match.
  #   * Endurosat quote 19.2 W in LEO from one 0.0715 m2 panel = 268 W/m2
  #     delivered — which is this file's own EOL K (267.9). The loss stack was
  #     already right; only the AREA was fictional.
  # Peak whole-spacecraft generation drops 123.8 -> 88.6 W, orbit-average at
  # the worst beta (49.8 deg, EOL) 54.5 -> 39.6 W, against a 27.7 W nominal
  # orbit-average load: R1's acceptance criterion (gen > load with ALL
  # nominal systems on including ADCS) still closes at 1.43x.
  # Derivation and citations: docs/plan_2026-08b/POWER_SIZING.md.
  wing_py_area_m2: 0.120
  wing_my_area_m2: 0.120
  wing_deploy_time_s: 30.0 # Burn wire release + spring deployment
  # Single-axis solar array drive (brief 01 F4/F5 / WP-2). The command
  # (EPS set_solar_array_drive), device gate (0x0101) and telemetry (0x0133)
  # all existed but drove nothing. With sada_tracking the wing pair follows
  # the sun's projection perpendicular to the drive axis continuously
  # (cos beta), 1.56x the fixed-wing |sin phi| duty from the same area.
  sada_present: true
  # Phase C: with the real LVLH attitude frame (+Z = nadir boresight) the
  # orbit normal is the body ±Y axis (the wing mounting axis), so the drive
  # rotates about Y. Phase B's synthetic frame had labelled the same
  # geometric axis 'z' before an attitude existed.
  sada_axis: y             # rotation axis = body Y = orbit normal (LVLH)
  sada_tracking: true      # false => wings frozen at solar_array_drive_angle
  sada_max_rate_deg_s: 1.0
# ── Payload (2026-08b R1) ──────────────────────────────────────────────
# Reference part: Simera Sense TriScape100 (a real 6U-class EO imager,
# 98x98x176 mm, 1.1 kg, 4.75 m GSD at 500 km). Datasheet, 5.0 V rail:
#   imaging   1100 mA = 5.50 W
#   idle      470 mA  = 2.35 W   (readout mode is also 470 mA)
# The old pair was physically impossible — standby (6.0 W) drew MORE than
# imaging (5.0 W). It is now ordered, and both ends are a datasheet number.
payload_power_w: 5.5           # TriScape100 imaging mode
payload_standby_power_w: 2.4   # TriScape100 idle mode
# FPA thermo-electric cooler. RESTORED 10.0 -> 15.0: payload.yaml, tcs.yaml,
# the flight manual, the textbook and the commissioning procedure all say
# 15 W; eps.yaml alone had drifted down, so the EPS books under-billed the
# cooler by 5 W whenever it ran.
fpa_cooler_power_w: 15.0
# ── S-band transponder (2026-08b R1) ───────────────────────────────────
# R1: "a CubeSat would generally not have a 20 W transmitter". Correct — the
# 20 W figure was a whole-line DC draw invented for the manual, and no
# CubeSat radio draws it. Reference part: Endurosat S-band Transceiver
# (246 g, 11-28 V):
#   output power range      24-33 dBm  (0.25-2.0 W RF)
#   idle / Rx only          1.2 W @ 12 V
#   max transmit (33 dBm)   11 W @ 12 V
# So the RF output is 2 W, not 20 W, and the DC draw while transmitting is
# 5-11 W depending on commanded EIRP.
#   LOW  tier (16 kbps, ~27 dBm / 0.5 W RF)   -> 5 W DC   (unchanged)
#   HIGH tier (128 kbps dump, 33 dBm / 2 W RF) -> 11 W DC  (was 10)
# NOTE for Phase 3 (TT&C owner): ttc.yaml's EIRP must be DERIVED from these,
# or the link budget and the power budget describe different radios (T-b).
transponder_power_w: 5.0
transponder_hi_power_w: 11.0
# Non-switchable receive chain: Endurosat S-band idle/Rx-only 1.2 W, plus
# ~0.3 W for the UHF beacon receiver R2 adds in Phase 3.
transponder_rx_power_w: 1.5
# NOTE: protection levels (load-shed voltage/order, UV/OV, overcurrent trips),
# initial SoC, event thresholds and the htr_bat/htr_obc/aocs_wheels line loads
# are SIMULATION tuning and live in ../simulation.yaml (eps: section).

# Power line initial states (overrides defaults)
power_lines:
  obc: true          # non-switchable, always ON
  ttc_rx: true       # non-switchable, always ON
  ttc_tx: false      # switchable, default OFF (commanded on after AOS)
  payload: false     # switchable, default OFF
  fpa_cooler: false  # switchable, default OFF
  htr_bat: false     # switchable, default OFF
  htr_obc: false     # switchable, default OFF
  aocs_wheels: false # switchable, default OFF — AOCS commissioned in LEOP
  prop: false        # switchable, default OFF — Phase D propulsion line
                     # (catbed heater + valve drivers), powered for manoeuvre
                     # preparation only; LAST in the load-shed order

param_ids:
  bat_voltage: 0x0100
  bat_soc: 0x0101
  bat_temp: 0x0102
  sa_a_current: 0x0103
  sa_b_current: 0x0104
  bus_voltage: 0x0105
  power_cons: 0x0106
  power_gen: 0x0107
  eclipse_flag: 0x0108
  bat_current: 0x0109
  bat_capacity_wh: 0x010A
