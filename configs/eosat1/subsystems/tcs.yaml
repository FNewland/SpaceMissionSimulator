model: tcs_basic

zones:
  - name: panel_px
    capacitance_j_per_c: 5000
    time_constant_s: 600
    initial_temp_c: 15.0
  - name: panel_mx
    capacitance_j_per_c: 5000
    time_constant_s: 600
    initial_temp_c: 12.0
  - name: panel_py
    capacitance_j_per_c: 4000
    time_constant_s: 500
    initial_temp_c: 20.0
  - name: panel_my
    capacitance_j_per_c: 4000
    time_constant_s: 500
    initial_temp_c: 18.0
  - name: panel_pz
    capacitance_j_per_c: 3000
    time_constant_s: 800
    initial_temp_c: 10.0
  - name: panel_mz
    capacitance_j_per_c: 3000
    time_constant_s: 800
    initial_temp_c: 8.0
  # Battery pack node (Phase B, brief 05 WP-3): ~0.9 kg of Li-ion at
  # ~900 J/kg/K gives C = 800 J/K; the pack is mounted on thermal standoffs
  # against the radiator side, UA = C/tau = 0.30 W/K, so the 8 W heater has
  # ~27 K of authority and the thermostat genuinely cycles.
  - name: battery
    capacitance_j_per_c: 800
    time_constant_s: 2667
    initial_temp_c: 8.0
  # Thruster catalyst-bed node (Phase D): small catalyst bed + heater
  # blanket, C = 50 J/K, tau = 1200 s => UA = 0.042 W/K. The 12 W heater has
  # ~288 K of authority: 180 C (propulsion arm interlock) in ~18 min, 200 C
  # in ~22 min — the design sheet's "12 W for 20 min = 4.0 Wh" preheat.
  - name: thruster
    capacitance_j_per_c: 50
    time_constant_s: 1200
    initial_temp_c: 5.0

heaters:
  # Phase B (brief 05 defect 2 / WP-3): setpoints reconciled to the manual
  # (03_tcs.md: ON +5 / OFF +10 C, 8 W). The old ON +1 C sat 9 C below the
  # coldest temperature the battery node could ever reach, so the thermostat
  # could never fire and the heater indicator was static forever.
  - name: battery
    power_w: 8.0
    on_temp_c: 5.0
    off_temp_c: 10.0
  - name: obc
    power_w: 4.0
    on_temp_c: 5.0
    off_temp_c: 10.0
  # Catbed heater (Phase D): HEATER_THRUSTER (S8 func 42) makes this circuit
  # load-bearing for the first time. MANUAL by default (preheat is an
  # explicit NOM-013 step); HEATER_AUTO_MODE circuit=2 enables the 190/230 C
  # thermostat hold. Powered from the EPS `prop` line; billed from actual
  # heater state (0x041B) like every other heater.
  - name: thruster
    power_w: 12.0
    on_temp_c: 190.0
    off_temp_c: 230.0

fpa_cooler_target_c: -15.0
# ABSOLUTE ceiling on the cooler's heat lift below the ambient sink (K).
#
# 2026-08b: this used to be the WHOLE cooler model — a flat 40 K with no
# coupling to `fpa_cooler_power_w`, so the machine had as much authority at a
# 39 K lift as at a 1 K lift and "the cooler is struggling" was not a state
# the simulator could enter. It is now only the ceiling; the lift ACHIEVABLE
# at any instant is computed from the cooler's efficiency in
# `tcs_basic.TCSBasicModel._fpa_achievable_lift_k`, which carries the full
# derivation and the citations. Summary:
#
#   * -15 C from the +12 C internal sink is a 27 K lift. The FPA node's
#     UA = C/tau = 100/120 = 0.833 W/K, so 22.5 W has to be pumped from 15 W
#     of input: COP 1.50.
#   * A single-stage Bi2Te3 thermoelectric cannot do that. Goldsmid's
#     optimum-current result COP_max = (Tc/dT)(g - Th/Tc)/(g + 1),
#     g = sqrt(1 + Z.Tm), with ZT ~ 0.73 gives COP_max = 0.88 at this lift.
#     The "Peltier envelope" wording elsewhere in the tree is therefore the
#     thing that was wrong, not the mission.
#   * 1.50 is 15.7 % of the Carnot COP (Tc/dT = 9.56), well inside the
#     10-25 % of Carnot that miniature Stirling / free-piston space coolers
#     reach at near-ambient lifts — the class of machine cooled small-sat EO
#     detectors actually fly. The model is that machine, at 23 % of Carnot.
#
# Measured on the fixed model (`_fpa_achievable_lift_k`):
#   sink +12 C idle      32.35 K -> floor -20.35 C   (-20 C setpoint just holds)
#   sink +12 C imaging   31.24 K -> floor -19.24 C   (-20 C setpoint does not)
#   sink +20 C idle      32.83 K -> floor -12.83 C   (-15 C setpoint does not)
# The nominal -15 C keeps ~5 K of margin, so the shipped mission is unchanged;
# the margin is now finite, spendable and VISIBLE at 0x0424 (achievable floor)
# and 0x0425 (margin), mirrored by the payload at 0x064A / 0x064B.
fpa_cooler_max_lift_k: 40.0
# Cooler efficiency model (DISPLAY_REQUESTS_PAYLOAD.md §8.2). These three were
# read by `tcs_basic._fpa_achievable_lift_k` but NOT declared in TCSConfig,
# which is a StrictModel — so putting them here would have been REJECTED by the
# loader and the model's own literals were the live values. TCSConfig now
# declares all three and they are real configuration; the Carnot fraction is
# the knob for a "the cooler is degrading" scenario.
fpa_cooler_power_w: 15.0          # matches subsystems/payload.yaml
fpa_cooler_carnot_fraction: 0.23  # miniature Stirling class, see below
fpa_imaging_load_w: 2.0           # detector/ROIC dissipation while IMAGING

# ---------------------------------------------------------------------------
# FPA THERMAL ENVELOPE — THE SINGLE SOURCE  (DECISIONS §3, ruled in G3-d)
# ---------------------------------------------------------------------------
# TCS owns the FPA node (brief 05 WP-1: the payload *reads* it), so the
# envelope lives here and everything else is DERIVED from it by
# smo_common.config.fpa_envelope.FPAEnvelope:
#
#   monitoring/s12_definitions.yaml   0x0408 warn/alarm, 0x0601 warn
#   mcs/limits.yaml                   0x0408, 0x0601, 0x0617
#   event_thresholds.*.fpa below      TCS warning/alarm events
#   planning/activity_types.yaml      fpa_temp_min_c / fpa_temp_max_c
#   models/tcs_basic.py, payload_basic.py   readiness, over/under-temp events
#   configs/eosat1/manual/03_tcs.md, 06_payload.md, 08_fdir.md
#
# tests/test_content/test_fpa_envelope_single_source.py recomputes every one
# of those and fails if any has drifted. Change a number HERE and propagate;
# never edit a derived band directly.
#
# The numbers below are measured off the corrected model, not remembered.
# Phase B fixed the setpoint bug (the setpoint was used as an additive
# environment offset, so the node asymptoted to ambient-35 K and never to the
# setpoint) and Phase E made the setpoint commandable, so this is the first
# build in which the achievable range is real. 10 000 s of seeded steady
# state, payload in the loop:
#
#   cooler ON  setpoint -15 C   node -15.01 C, sigma 0.138 K
#   cooler ON  setpoint -20 C   node -19.99 C, sigma 0.110 K
#   cooler ON  setpoint   0 C   node  +0.01 C, sigma 0.110 K
#   cooler OFF                  node +11.43 C, sigma 0.902 K, peak +12.41 C
#   detector 0x0601             node - 0.44 K, sigma 0.120 K
fpa_envelope:
  # Commandable regulation envelope. MUST match PAYLOAD_COOLER_SETPOINT
  # (S8 func 36) `range` in commands/tc_catalog.yaml.
  setpoint_min_c: -20.0
  setpoint_max_c: 0.0
  setpoint_default_c: -15.0
  # Measured control performance and uncooled equilibrium.
  control_3sigma_k: 0.5      # measured 0.41 K node / 0.45 K detector
  uncooled_max_c: 12.5       # measured peak +12.41 C, rounded up
  # Offsets down the payload thermal chain: bracket -> cold finger -> die.
  detector_offset_c: -0.5    # 0x0601 payload.fpa_temp
  die_offset_c: 0.5          # 0x0617 payload.detector_temp, above the finger
  # Imaging readiness — a SCIENCE limit, not a health limit. The textbook,
  # the FPA_OVERTEMP event and the planner precondition already agreed on
  # -3 C; the planner's -5 C and the manual's -12 C were the outliers.
  imaging_max_c: -3.0
  # Regulation tolerance, relative to the ACTIVE setpoint. Readiness has to
  # follow a commanded setpoint change; pinning it to -15 is what broke when
  # Phase E made the setpoint commandable.
  ready_band_below_k: 1.0
  ready_band_above_k: 5.0
  # Limit-band construction margins.
  warning_margin_k: 1.5
  alarm_margin_k: 5.0

# Thermal zone coupling (conduction/radiation parameters)
thermal_coupling:
  zone_conductance:
    # Phase B: 0.5 -> 0.1 W/K. The battery pack is on thermal standoffs; at
    # 0.5 W/K the warm OBC swamped the battery node's own 0.3 W/K sink and
    # parked it above the thermostat band forever (brief 05 WP-3).
    battery_obc: 0.1
    structure_electronics: 0.8
    payload_structure: 0.4
  space_radiation_g: 0.2  # W/K radiative coupling to space (3K sink)

# Event thresholds
#
# The `fpa` rows are DERIVED from fpa_envelope above — do not hand-edit them.
# They used to be [-50, -5] warn / [-60, 0] alarm, which is not a limit band
# at all: it is an imaging-readiness band, and tcs_basic was using it as one
# (`fpa_ready = warn_low <= T <= warn_high`). That conflation is why the FPA
# had five answers. Readiness is now computed from the ACTIVE setpoint plus
# fpa_envelope.imaging_max_c, and these rows carry the health band that
# brackets every legitimate state — cooled anywhere in the command envelope,
# and uncooled.
event_thresholds:
  temperature_warning:
    battery: [0.0, 40.0]    # [low_warn_C, high_warn_C]
    obc: [5.0, 50.0]
    fpa: [-22.0, 14.0]      # derived: setpoint_min - 3sigma - 1.5 .. uncooled_max + 1.5
  temperature_alarm:
    battery: [-10.0, 50.0]
    obc: [-5.0, 60.0]
    fpa: [-25.5, 17.5]      # derived: setpoint_min - 3sigma - 5.0 .. uncooled_max + 5.0
  thermal_runaway_rate_deg_per_min: 2.0

param_ids:
  temp_panel_px: 0x0400
  temp_panel_mx: 0x0401
  temp_panel_py: 0x0402
  temp_panel_my: 0x0403
  temp_panel_pz: 0x0404
  temp_panel_mz: 0x0405
  temp_obc: 0x0406
  temp_battery: 0x0407
  temp_fpa: 0x0408
  temp_thruster: 0x0409   # catalyst bed — the propulsion arm interlock reads this
  htr_battery: 0x040A
  htr_obc: 0x040B
  cooler_fpa: 0x040C
  htr_thruster: 0x041B    # Phase D: NOT 0x040D (that id is ttc.pa_backup_temp)
  htr_duty_battery: 0x040E
  htr_duty_obc: 0x040F
  htr_total_power_w: 0x0411
  decontamination_active: 0x0418
  thermal_gradient: 0x0419
