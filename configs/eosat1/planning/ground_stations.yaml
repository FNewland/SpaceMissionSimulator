# EOSAT-1 Ground Station Configuration — S-band
# Canonical source: mission.yaml specifies S-band.
# Frequencies per CCSDS 401.0-B for near-Earth S-band links.
#
# NOTE (defect #42 — config duplication): this file is the RF AUGMENTATION
# layer only (antenna, band, G/T, frequencies, TX power). Station GEOMETRY
# (lat/lon/alt/min_elevation) is canonically defined in ../orbit.yaml, which
# the simulator/planner/MCS all load. The geometry fields duplicated below
# exist for standalone RF tooling convenience and MUST match orbit.yaml —
# the MCS cross-checks them at load and logs a warning if they diverge.
# When adding/moving a station, edit ../orbit.yaml first, then mirror here.
ground_stations:
  - name: Iqaluit
    lat_deg: 63.747
    lon_deg: -68.518
    alt_km: 0.034
    min_elevation_deg: 5.0
    antenna_diameter_m: 9.0
    band: S-band
    g_t_db: 20.0
    tx_power_w: 200.0
    tx_freq_mhz: 2025.0    # S-band uplink (2025-2110 MHz)
    rx_freq_mhz: 2200.0    # S-band downlink (2200-2290 MHz)
